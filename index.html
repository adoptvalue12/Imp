function LensOverlay({lens, pos, onMove}){
  function onPointerDown(e){
    e.stopPropagation();
    const target = e.currentTarget;
    try{ target.setPointerCapture(e.pointerId); }catch(err){}
    const parent = target.parentElement;
    const rect = parent.getBoundingClientRect();
    function move(ev){
      const xPct = ((ev.clientX - rect.left)/rect.width)*100;
      const yPct = ((ev.clientY - rect.top)/rect.height)*100;
      onMove({x:clampPct(xPct), y:clampPct(yPct)});
    }
    function up(){
      target.removeEventListener("pointermove", move);
      target.removeEventListener("pointerup", up);
    }
    target.addEventListener("pointermove", move);
    target.addEventListener("pointerup", up);
  }
  return <div className="lens-sticker" style={{left:pos.x+"%", top:pos.y+"%"}} onPointerDown={onPointerDown}>{lens.emoji}</div>;
}

function CameraView({me, pending, onCaptured, onGoChat, onOpenProfile, onToast}){
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const holdTimerRef = useRef(null);
  const recIntervalRef = useRef(null);
  const galleryInputRef = useRef(null);

  const [mode, setMode] = useState("loading");
  const [filter, setFilter] = useState("none");
  const [activeLens, setActiveLens] = useState(null);
  const [lensPos, setLensPos] = useState({x:50, y:38});
  const [flash, setFlash] = useState(false);
  const [canRecord, setCanRecord] = useState(false);
  const [recording, setRecording] = useState(false);
  const [locked, setLocked] = useState(false);
  const [recSeconds, setRecSeconds] = useState(0);
  const [facing, setFacing] = useState("user");

  useEffect(() => {
    let cancelled = false;
    async function tryStream(constraints){
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      if(cancelled){ stream.getTracks().forEach(t=>t.stop()); return null; }
      streamRef.current = stream;
      setMode("live");
      setCanRecord(!!window.MediaRecorder);
      return stream;
    }
    async function start(){
      const base = {facingMode:facing, width:{ideal:400}, height:{ideal:400}, frameRate:{ideal:24}};
      try{
        await tryStream({video:base, audio:true});
      }catch(e){
        try{
          await tryStream({video:base, audio:false});
        }catch(e2){
          if(!cancelled) setMode("fallback");
        }
      }
    }
    start();
    return () => {
      cancelled = true;
      if(recIntervalRef.current) clearInterval(recIntervalRef.current);
      if(recorderRef.current && recorderRef.current.state !== "inactive"){ try{ recorderRef.current.stop(); }catch(e){} }
      if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    };
  }, [facing]);

  function switchCamera(){
    if(recording) return;
    setMode("loading");
    setFacing(prev => prev === "user" ? "environment" : "user");
  }

  useEffect(() => {
    if(mode === "live" && videoRef.current && streamRef.current){
      videoRef.current.srcObject = streamRef.current;
    }
  }, [mode]);

  function doFlash(){ setFlash(true); setTimeout(()=>setFlash(false), 300); }

  function captureLive(){
    const video = videoRef.current;
    if(!video || !video.videoWidth) return;
    const size = 480;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const vw = video.videoWidth, vh = video.videoHeight;
    const side = Math.min(vw, vh);
    const sx = (vw-side)/2, sy = (vh-side)/2;
    ctx.save();
    ctx.filter = filterCss(filter);
    if(facing === "user"){ ctx.translate(size, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, side, side, 0, 0, size, size);
    ctx.restore();
    if(activeLens){
      ctx.save();
      ctx.filter = "none";
      const lx = (lensPos.x/100)*size;
      const ly = (lensPos.y/100)*size;
      ctx.font = Math.round(size*0.22)+"px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(activeLens.emoji, lx, ly);
      ctx.restore();
    }
    const dataUrl = canvas.toDataURL("image/jpeg", 0.65);
    doFlash();
    onCaptured({kind:"photo", img:dataUrl});
  }

  function captureSticker(opt){
    doFlash();
    onCaptured({kind:"photo", stickerEmoji:opt.emoji, stickerBg:opt.bg, filterId:filter});
  }

  function importVideoFile(file){
    onToast("Import de la vidéo...");
    const mb = (file.size/1000000).toFixed(1);
    const maxMb = Math.round(MAX_CLIP_BYTES/1000000);
    if(file.size > MAX_CLIP_BYTES){
      onToast("Vidéo trop lourde ("+mb+" Mo, max "+maxMb+" Mo) — choisis-en une plus courte ✂️");
      return;
    }

    const url = URL.createObjectURL(file);
    const probe = document.createElement("video");
    probe.preload = "metadata";
    probe.src = url;
    let settled = false;

    function finishUpload(){
      if(settled) return;
      settled = true;
      URL.revokeObjectURL(url);
      const reader = new FileReader();
      reader.onload = () => onCaptured({kind:"clip", video:reader.result});
      reader.onerror = () => onToast("Erreur de lecture du fichier");
      reader.readAsDataURL(file);
    }

    probe.onloadedmetadata = () => {
      if(settled) return;
      const dur = probe.duration;
      if(dur && isFinite(dur) && dur > MAX_CLIP_SECONDS + 1){
        settled = true;
        URL.revokeObjectURL(url);
        onToast("Vidéo trop longue ("+Math.round(dur)+"s, max "+MAX_CLIP_SECONDS+"s) — choisis-en une plus courte ✂️");
        return;
      }
      finishUpload();
    };
    probe.onerror = () => {
      // Impossible de lire les métadonnées (format inhabituel) : on tente quand même l'envoi direct,
      // la taille a déjà été validée plus haut.
      finishUpload();
    };
    // Filet de sécurité : si les métadonnées ne se chargent jamais, on envoie quand même après 4s
    // plutôt que de laisser l'utilisateur face à un écran qui ne fait rien.
    setTimeout(finishUpload, 4000);
  }

  function handleGalleryFile(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(file.type.indexOf("video") === 0){
      importVideoFile(file);
    }else if(file.type.indexOf("image") === 0){
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 480;
          const canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext("2d");
          const side = Math.min(img.width, img.height);
          const sx = (img.width-side)/2, sy = (img.height-side)/2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          onCaptured({kind:"photo", img: canvas.toDataURL("image/jpeg", 0.7)});
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function pickMimeType(){
    const candidates = ["video/webm;codecs=vp8,opus","video/webm;codecs=vp9,opus","video/webm","video/mp4"];
    for(const c of candidates){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return "";
  }

  function startRecording(){
    const stream = streamRef.current;
    if(!stream || !window.MediaRecorder) return;
    const mime = pickMimeType();
    const recOpts = Object.assign({}, mime ? {mimeType:mime} : {}, {videoBitsPerSecond:CLIP_VIDEO_BITRATE, audioBitsPerSecond:CLIP_AUDIO_BITRATE});
    let recorder;
    try{ recorder = new MediaRecorder(stream, recOpts); }catch(e){
      try{ recorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream); }catch(e2){ return; }
    }
    chunksRef.current = [];
    recorder.ondataavailable = e => { if(e.data && e.data.size>0) chunksRef.current.push(e.data); };
    recorder.onstop = handleStop;
    recorderRef.current = recorder;
    recorder.start();
    setRecording(true);
    setRecSeconds(0);
    recIntervalRef.current = setInterval(() => {
      setRecSeconds(s => {
        if(s+1 >= MAX_CLIP_SECONDS){ stopRecording(); return MAX_CLIP_SECONDS; }
        return s+1;
      });
    }, 1000);
  }
  function stopRecording(){
    if(recorderRef.current && recorderRef.current.state !== "inactive") recorderRef.current.stop();
    if(recIntervalRef.current){ clearInterval(recIntervalRef.current); recIntervalRef.current = null; }
    setRecording(false);
    setLocked(false);
  }
  function handleStop(){
    const recorder = recorderRef.current;
    const blob = new Blob(chunksRef.current, {type: (recorder && recorder.mimeType) || "video/webm"});
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const approxBytes = Math.round((dataUrl.length - 22) * 0.75);
      if(approxBytes > MAX_CLIP_BYTES){
        onToast("Clip trop lourd — réessaie un peu plus court ✂️");
        return;
      }
      onCaptured({kind:"clip", video:dataUrl});
    };
    reader.readAsDataURL(blob);
  }

  function onShutterDown(e){
    if(mode !== "live") return;
    if(e && e.pointerId!=null && e.target && e.target.setPointerCapture){ try{ e.target.setPointerCapture(e.pointerId); }catch(err){} }
    holdTimerRef.current = setTimeout(() => {
      holdTimerRef.current = null;
      if(canRecord) startRecording();
    }, 280);
  }
  function onShutterUp(){
    if(holdTimerRef.current){
      clearTimeout(holdTimerRef.current);
      holdTimerRef.current = null;
      captureLive();
    }else if(recording && !locked){
      stopRecording();
    }
  }
  function onShutterLeave(){
    if(holdTimerRef.current){ clearTimeout(holdTimerRef.current); holdTimerRef.current = null; }
    if(recording && !locked) stopRecording();
  }
  function toggleLockRecord(){
    if(recording){
      stopRecording();
    }else{
      if(!canRecord) return;
      setLocked(true);
      startRecording();
    }
  }

  function pickLens(l){
    setActiveLens(prev => (prev && prev.id===l.id) ? null : l);
    setLensPos({x:50, y:38});
  }

  return (
    <div className="cam-view">
      <div className="cam-live-wrap">
        <div className={"flash"+(flash?" on":"")}></div>
        <div className="cam-topbar">
          <button className="cam-icon-btn" onClick={onGoChat}>💬</button>
          {mode === "live" && <button className="cam-icon-btn" onClick={switchCamera} title="Changer de caméra">🔄</button>}
          <button className="cam-icon-btn" style={me.avatarUrl ? {backgroundImage:"url("+me.avatarUrl+")", backgroundSize:"cover", backgroundPosition:"center"} : {background:me.color}} onClick={onOpenProfile}>
            {!me.avatarUrl && me.emoji}{pending>0 && <span className="badge">{pending}</span>}
          </button>
        </div>
        {mode === "loading" && <div className="cam-hint">Ouverture de la caméra...</div>}
        {mode === "live" && (
          <React.Fragment>
            <video ref={videoRef} autoPlay playsInline muted className="cam-video" style={{filter:filterCss(filter), transform: facing==="user" ? "scaleX(-1)" : "none"}} />
            {activeLens && <LensOverlay lens={activeLens} pos={lensPos} onMove={setLensPos} />}
            {recording && <div className="rec-timer">⏺ {recSeconds}s / {MAX_CLIP_SECONDS}s</div>}
          </React.Fragment>
        )}
        {mode === "fallback" && (
          <div style={{width:"100%", height:"100%"}}>
            <div className="cam-hint">Caméra indisponible ici — importe depuis ta galerie ou choisis un visuel ✨</div>
            <div style={{padding:"70px 16px 0"}}>
              <button className="primary-btn" onClick={()=>galleryInputRef.current && galleryInputRef.current.click()}>🖼️ Choisir depuis la galerie</button>
              <input ref={galleryInputRef} type="file" accept="image/*,video/*" style={{display:"none"}} onChange={handleGalleryFile} />
            </div>
            <div className="sticker-grid">
              {STICKER_OPTIONS.map((o,i) => (
                <button key={i} className="sticker-opt" style={{background:o.bg, filter:filterCss(filter)}} onClick={()=>captureSticker(o)}>{o.emoji}</button>
              ))}
            </div>
          </div>
        )}
      </div>

      <div className="filter-strip">
        {FILTERS.map(f => (
          <div key={f.id} className={"fchip"+(filter===f.id?" active":"")} onClick={()=>setFilter(f.id)} title={f.label}>{f.emoji}</div>
        ))}
      </div>
      {mode === "live" && (
        <div className="filter-strip">
          {LENSES.map(l => (
            <div key={l.id} className={"fchip"+(activeLens && activeLens.id===l.id?" active":"")} onClick={()=>pickLens(l)} title={l.label}>{l.emoji}</div>
          ))}
        </div>
      )}

      {mode === "live" && (
        <div className="cam-controls">
          <div style={{display:"flex", alignItems:"center", justifyContent:"center", gap:26, width:"100%"}}>
            <button className="gallery-btn" onClick={()=>galleryInputRef.current && galleryInputRef.current.click()} title="Depuis la galerie">🖼️</button>
            <button
              className={"shutter"+(recording?" recording":"")}
              onPointerDown={onShutterDown}
              onPointerUp={onShutterUp}
              onPointerLeave={onShutterLeave}
              onPointerCancel={onShutterLeave}
              onContextMenu={(e)=>e.preventDefault()}
            ></button>
            {canRecord ? (
              <button className={"gallery-btn"+(locked?" lock-active":"")} onClick={toggleLockRecord} title="Enregistrement mains libres">{locked ? "🔓" : "🔒"}</button>
            ) : <div style={{width:44}}></div>}
          </div>
          {canRecord && <p className="shutter-hint">{locked ? "Enregistrement verrouillé — toque 🔓 pour arrêter" : "Toque = photo · Maintiens = clip · 🔒 = mains libres"}</p>}
          <input ref={galleryInputRef} type="file" accept="image/*,video/*" style={{display:"none"}} onChange={handleGalleryFile} />
        </div>
      )}
    </div>
  );
}

function FeedPostCard({me, post, onLike, onPlaySound, onDelete, onComment, onShare, tagDefs, t}){
  const [pop, setPop] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const liked = (post.likes||[]).includes(me.code);
  const imgStyle = post.img ? {backgroundImage:"url("+post.img+")"} : {background:post.bg};
  const tag = post.authorTag ? (tagDefs||[]).find(function(tg){ return tg.id===post.authorTag; }) : null;

  function popHeart(){
    setPop(true);
    setTimeout(()=>setPop(false), 650);
  }
  function onDoubleTap(){
    if(!liked) onLike(post.id);
    popHeart();
  }
  function handleDeleteClick(){
    if(confirmDelete){
      onDelete(post.id);
    }else{
      setConfirmDelete(true);
      setTimeout(()=>setConfirmDelete(false), 3000);
    }
  }

  return (
    <div className="feed-card">
      <div className="feed-user-row">
        <div className="feed-user"><span style={{fontSize:19}}>{post.authorEmoji}</span><span style={nameTextStyle({fontFamily:post.authorFont, nameGradientFrom:post.authorNameFrom, nameGradientTo:post.authorNameTo})}>{post.authorName}</span>{tag && <span style={{marginLeft:6}}><TagBadge tag={tag} /></span>}</div>
        {post.authorCode === me.code && (
          <button className="delete-post-btn" onClick={handleDeleteClick}>{confirmDelete ? t("action_confirm") : <Icon name="trash" size={16} />}</button>
        )}
      </div>
      <div className="feed-img" style={imgStyle} onDoubleClick={onDoubleTap}>

        {pop && <div className="heart-pop">❤️</div>}

      <div className="feed-body">
        {post.caption && <div className="feed-caption">{renderCaption(post.caption)}</div>}
        {post.soundTitle && <div className="post-sound-chip" onClick={()=>onPlaySound(post.soundId)}>🎵 {post.soundTitle}</div>}
        <div className="feed-actions">
          <button onClick={()=>onLike(post.id)}><Icon name={liked ? "heart" : "heart-outline"} size={20} /></button>
          <span style={{fontSize:12, color:"#8b8397", fontWeight:600}}>{(post.likes||[]).length}</span>
          <button onClick={()=>onComment(post)}>💬</button>
          <span style={{fontSize:12, color:"#8b8397", fontWeight:600}}>{post.commentCount||0}</span>
          <button onClick={()=>onShare(post)}>📤</button>
          <span style={{marginLeft:"auto", fontSize:11, color:"#b3abc0"}}>{timeAgo(post.ts)}</span>

function CommentsModal({me, target, onClose, onToast, t}){
  const [comments, setComments] = useState(null);
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  useEffect(() => {
    window.firebaseApp.loadComments(target).then(setComments).catch(()=>setComments([]));
  }, [target.postId, target.clipId]);

  async function send(){
    const body = draft.trim();
    if(!body || busy) return;
    setBusy(true);
    try{
      const updated = await window.firebaseApp.addComment(me, target, body);
      setComments(updated);
      setDraft("");
    }catch(e){ onToast(e.message || "Erreur d'envoi"); }
    setBusy(false);
  }
  async function handleDelete(c){
    if(confirmDeleteId !== c.id){
      setConfirmDeleteId(c.id);
      setTimeout(()=>setConfirmDeleteId(prev => prev===c.id ? null : prev), 3000);
      return;
    }
    setConfirmDeleteId(null);
    try{
      const updated = await window.firebaseApp.deleteComment(me, c.id, target);
      setComments(updated);
    }catch(e){ onToast(e.message || "Erreur de suppression"); }
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>{t("comments_title")}</h3>
        <div style={{marginTop:12, maxHeight:320, overflowY:"auto"}}>
          {comments === null && <p className="sub">...</p>}
          {comments && comments.length === 0 && <EmptyState emoji="💬" text={t("comments_empty")} />}
          {comments && comments.map(c => (
            <div className="req-row" key={c.id} style={{alignItems:"flex-start"}}>
              <div style={{fontSize:19}}>{c.authorEmoji}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontWeight:700, fontSize:13}}>{c.authorName} <span style={{fontWeight:400, color:"#b3abc0", fontSize:11}}>{timeAgo(c.ts)}</span></div>
                <div style={{fontSize:13.5, wordBreak:"break-word"}}>{c.body}</div>
              </div>
              {c.authorCode === me.code && (
                <button className="decline-btn" onClick={()=>handleDelete(c)}>{confirmDeleteId===c.id ? t("action_confirm") : "🗑️"}</button>
              )}
            </div>
          ))}
        </div>
        <div className="composer" style={{padding:"10px 0 0", borderTop:"1px solid var(--line)", marginTop:10}}>
          <input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") send();}} placeholder={t("comments_placeholder")} maxLength={300} />
          <button className="sendbtn" onClick={send} disabled={!draft.trim()||busy}>➤</button>
        </div>
      </div>
    </div>
  );
}

function SharePickerModal({me, item, friends, onClose, onToast, t}){
  const [picked, setPicked] = useState([]);
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);

  function togglePick(f){
    setPicked(function(prev){
      return prev.some(function(x){ return x.code===f.code; }) ? prev.filter(function(x){ return x.code!==f.code; }) : [...prev, f];
    });
  }
  async function send(){
    if(picked.length===0 || busy) return;
    setBusy(true);
    try{
      await window.firebaseApp.shareItemToFriends(me, item, picked.map(function(f){ return f.code; }));
      setSent(true);
      onToast(item.type === "clip" ? "Clip partagé 📤" : "Story partagée 📤");
      setTimeout(onClose, 700);
    }catch(e){ onToast(e.message || "Erreur de partage"); }
    setBusy(false);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>{t("share_title")}</h3>
        <div style={{marginTop:12, maxHeight:280, overflowY:"auto"}}>
          {friends.length === 0 && <EmptyState emoji="🙋" text={t("share_empty")} />}
          {friends.map(f => {
            const on = picked.some(function(x){ return x.code===f.code; });
            return (
              <div key={f.code} className={"chip-select"+(on?" on":"")} onClick={()=>togglePick(f)}>
                <Avatar person={f} size={30} fontSize={14} />
                <span style={{fontWeight:700, fontSize:13.5}}>{f.name}</span>
                {on && <span style={{marginLeft:"auto"}}>✓</span>}
              </div>
            );
          })}
        </div>
        <button className="primary-btn" disabled={picked.length===0 || busy} onClick={send}>{sent ? "✓" : busy ? "..." : t("action_send")+" ("+picked.length+")"}</button>
      </div>
    </div>
  );
}

  }
  function togglePick(f){
    setPicked(function(prev){
      return prev.some(function(x){ return x.code===f.code; }) ? prev.filter(function(x){ return x.code!==f.code; }) : [...prev, f];
    });
  }
  async function addMembers(){
    setBusy(true);
    await window.firebaseApp.addGroupMembers(me, groupId, picked);
    const updated = await window.firebaseApp.loadGroupInfo(groupId);
    setInfo(updated);
    setPicked([]);
    setShowAdd(false);
    setBusy(false);
    onToast("Membres ajoutés 🎉");
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>{info.emoji} {info.name}</h3>
        <p className="sub">{info.members.length} membre{info.members.length>1?"s":""}</p>

        {!showAdd && (
          <React.Fragment>
            <div style={{marginTop:12, maxHeight:260, overflowY:"auto"}}>
              {info.members.map(m => (
                <div className="req-row" key={m.code}>
                  <Avatar person={m} size={38} fontSize={16} />
                  <span style={{fontWeight:700, fontSize:13.5}}>{m.name}{m.code===info.createdBy ? " 👑" : ""}</span>
                  {isCreator && m.code !== info.createdBy && (
                    <button className="decline-btn" style={{marginLeft:"auto"}} onClick={()=>kick(m.code)}>Retirer</button>
                  )}
                </div>
              ))}
            </div>
            <button className="mini-btn" style={{marginTop:12}} onClick={()=>setShowAdd(true)}>+ Ajouter des amis</button>
          </React.Fragment>
        )}

        {showAdd && (
          <React.Fragment>
            <div style={{marginTop:12, maxHeight:220, overflowY:"auto"}}>
              {addable.length === 0 && <EmptyState emoji="🙋" text="Tous tes amis sont déjà dans le groupe." />}
              {addable.map(f => {
                const on = picked.some(function(x){ return x.code===f.code; });
                return (
                  <div key={f.code} className={"chip-select"+(on?" on":"")} onClick={()=>togglePick(f)}>
                    <Avatar person={f} size={30} fontSize={14} />
                    <span style={{fontWeight:700, fontSize:13.5}}>{f.name}</span>
                    {on && <span style={{marginLeft:"auto"}}>✓</span>}
                  </div>
                );
              })}
            </div>
            <button className="primary-btn" disabled={picked.length===0 || busy} onClick={addMembers}>{busy?"Ajout...":"Ajouter"}</button>
            <button className="ghost-btn" onClick={()=>{setShowAdd(false); setPicked([]);}}>Annuler</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function AdminPanelModal({onClose, onToast, tagDefs, frameDefs}){
  const [tab, setTab] = useState("users");
  const [users, setUsers] = useState([]);
  const [search, setSearch] = useState("");
  const [messages, setMessages] = useState([]);
  const [comms, setComms] = useState([]);
  const [loading, setLoading] = useState(true);
  const [viewingUserCode, setViewingUserCode] = useState(null);
  const [userMsgs, setUserMsgs] = useState([]);
  const [managingFor, setManagingFor] = useState(null);
  const [userTagsCache, setUserTagsCache] = useState({});
  const [userFramesCache, setUserFramesCache] = useState({});
  const [pointsInput, setPointsInput] = useState({});

  useEffect(() => {
    setLoading(true);
    if(tab === "users"){
      window.firebaseApp.adminListUsers().then(function(u){ setUsers(u); setLoading(false); });
    }else if(tab === "messages"){
      window.firebaseApp.adminRecentMessages(150).then(function(m){ setMessages(m); setLoading(false); });
    }else{
      window.firebaseApp.adminListCommunities().then(function(c){ setComms(c); setLoading(false); });
    }
  }, [tab]);

  const visibleUsers = search.trim()
    ? users.filter(function(u){
        const q = search.trim().toLowerCase();
        return (u.name||"").toLowerCase().indexOf(q)>=0 || (u.code||"").toLowerCase().indexOf(q.replace("#",""))>=0;
      })
    : users;

  async function toggleBan(u){
    await window.firebaseApp.adminSetBanned(u.code, !u.banned);
    const updated = await window.firebaseApp.adminListUsers();
    setUsers(updated);
    onToast(u.banned ? "Compte débanni" : "Compte banni");
  }
  async function openManagePanel(code){
    setManagingFor(managingFor === code ? null : code);
    if(!userTagsCache[code]){
      const ids = await window.firebaseApp.adminUserTags(code);
      setUserTagsCache(function(prev){ return Object.assign({}, prev, {[code]: ids}); });
    }
    if(!userFramesCache[code]){
      const ids = await window.firebaseApp.adminUserFrames(code);
      setUserFramesCache(function(prev){ return Object.assign({}, prev, {[code]: ids}); });
    }
  }
  async function toggleUserTag(code, tagId, days){
    const has = (userTagsCache[code]||[]).includes(tagId);
    if(has){
      await window.firebaseApp.adminRevokeTag(code, tagId);
      setUserTagsCache(function(prev){ return Object.assign({}, prev, {[code]: prev[code].filter(function(t){ return t!==tagId; })}); });
      onToast("Tag retiré");
    }else{
      await window.firebaseApp.adminGrantTag(code, tagId, days);
      setUserTagsCache(function(prev){ return Object.assign({}, prev, {[code]: [...(prev[code]||[]), tagId]}); });
      onToast("Tag accordé"+(days?(" ("+days+"j)"):" (permanent)"));
    }
  }
  async function toggleUserFrame(code, frameId, days){
    const has = (userFramesCache[code]||[]).includes(frameId);
    if(has){
      await window.firebaseApp.adminRevokeFrame(code, frameId);
      setUserFramesCache(function(prev){ return Object.assign({}, prev, {[code]: prev[code].filter(function(t){ return t!==frameId; })}); });
      onToast("Cadre retiré");
    }else{
      await window.firebaseApp.adminGrantFrame(code, frameId, days);
      setUserFramesCache(function(prev){ return Object.assign({}, prev, {[code]: [...(prev[code]||[]), frameId]}); });
      onToast("Cadre accordé"+(days?(" ("+days+"j)"):" (permanent)"));
    }
  }
  async function grantPoints(code, sign){
    const raw = parseInt(pointsInput[code], 10);
    if(!raw){ onToast("Entre un nombre de points"); return; }
    try{
      await window.firebaseApp.adminGrantPoints(code, raw*sign);
      onToast((sign>0?"+":"-")+Math.abs(raw)+" ⚡ donné(s)");
      setPointsInput(function(prev){ return Object.assign({}, prev, {[code]: ""}); });
    }catch(e){ onToast(e.message || "Erreur"); }
  }
  async function viewUserMessages(code){
    setViewingUserCode(code);
    const m = await window.firebaseApp.adminUserMessages(code, 100);
    setUserMsgs(m);
  }
  async function deleteMsg(msgId, fromList){
    await window.firebaseApp.adminDeleteMessage(msgId);
    if(fromList === "recent"){ setMessages(function(prev){ return prev.filter(function(m){ return m.id!==msgId; }); }); }
    else{ setUserMsgs(function(prev){ return prev.filter(function(m){ return m.id!==msgId; }); }); }
    onToast("Message supprimé");
  }
  async function deleteComm(c){
    await window.firebaseApp.adminDeleteCommunity(c.id);
    setComms(function(prev){ return prev.filter(function(x){ return x.id!==c.id; }); });
    onToast("Communauté supprimée");
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>🛡️ Panel Admin</h3>

        {!viewingUserCode && (
          <React.Fragment>
            <div className="tab-row" style={{padding:"10px 0"}}>
              <button className={"tab-pill"+(tab==="users"?" on":"")} onClick={()=>setTab("users")}>Utilisateurs</button>
              <button className={"tab-pill"+(tab==="messages"?" on":"")} onClick={()=>setTab("messages")}>Messages</button>
              <button className={"tab-pill"+(tab==="communities"?" on":"")} onClick={()=>setTab("communities")}>Communautés</button>
            </div>
            {loading && <p className="sub">Chargement...</p>}
            {!loading && tab==="users" && (
              <div>
                <input className="add-input" style={{marginBottom:8}} placeholder="Chercher un pseudo ou un code (tape ton propre nom pour te gérer toi-même)" value={search} onChange={e=>setSearch(e.target.value)} />
                <div style={{maxHeight:380, overflowY:"auto"}}>
                {visibleUsers.map(u => (
                  <div key={u.code}>
                    <div className="req-row">
                      <Avatar person={u} size={34} fontSize={15} />
                      <div style={{flex:1, minWidth:0, cursor:"pointer"}} onClick={()=>viewUserMessages(u.code)}>
                        <div style={{fontWeight:700, fontSize:13}}>{u.name} {u.isAdmin ? "🛡️" : ""} {u.banned ? "🚫" : ""}</div>
                        <div style={{fontSize:11, color:"#8b8397"}}>{u.code}</div>
                      </div>
                      <button className="ghost-btn" style={{width:"auto", padding:"6px 10px"}} onClick={()=>openManagePanel(u.code)}>🎁 Gérer</button>
                      <button className={u.banned ? "accept-btn" : "decline-btn"} onClick={()=>toggleBan(u)}>{u.banned ? "Débannir" : "Bannir"}</button>
                    </div>
                    {managingFor === u.code && (
                      <div style={{padding:"2px 0 14px"}}>
                        <div style={{display:"flex", alignItems:"center", gap:6, marginBottom:8}}>
                          <input type="number" className="add-input" style={{flex:1, marginBottom:0}} placeholder="Points Shift" value={pointsInput[u.code]||""} onChange={e=>setPointsInput(function(prev){ return Object.assign({}, prev, {[u.code]: e.target.value}); })} />
                          <button className="accept-btn" style={{width:"auto", padding:"9px 12px"}} onClick={()=>grantPoints(u.code, 1)}>+ Donner</button>
                          <button className="decline-btn" style={{width:"auto", padding:"9px 12px"}} onClick={()=>grantPoints(u.code, -1)}>− Retirer</button>
                        </div>
                        <div className="sub" style={{marginBottom:4}}>Tags</div>
                        <div style={{display:"flex", flexWrap:"wrap", gap:6, marginBottom:10}}>
                          {(tagDefs||[]).map(t => {
                            const has = (userTagsCache[u.code]||[]).includes(t.id);
                            return (
                              <div key={t.id} style={{display:"flex", alignItems:"center", gap:4, background: has?"#EFE6FF":"#F7F3EC", borderRadius:10, padding:"4px 6px 4px 8px"}}>
                                <span style={{fontSize:11.5, fontWeight:700}}>{t.emoji} {t.label}</span>

                                {!has && <button className="ghost-btn" style={{width:"auto", padding:"3px 8px", fontSize:10.5}} onClick={()=>toggleUserTag(u.code, t.id, 7)}>7j</button>}
                                {has && <button className="decline-btn" style={{width:"auto", padding:"3px 8px", fontSize:10.5}} onClick={()=>toggleUserTag(u.code, t.id, null)}>Retirer</button>}
                              </div>
                            );
                          })}
                        </div>
                        <div className="sub" style={{marginBottom:4}}>Cadres</div>
                        <div style={{display:"flex", flexWrap:"wrap", gap:6}}>
                          {(frameDefs||[]).map(f => {
                            const has = (userFramesCache[u.code]||[]).includes(f.id);
                            return (
                              <div key={f.id} style={{display:"flex", alignItems:"center", gap:4, background: has?"#EFE6FF":"#F7F3EC", borderRadius:10, padding:"4px 6px 4px 8px"}}>

                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                ))}
                </div>
              </div>
            )}
            {!loading && tab==="messages" && (
              <div style={{maxHeight:400, overflowY:"auto"}}>
                {messages.length === 0 && <EmptyState emoji="📭" text="Aucun message pour l'instant." />}

function EditProfileModal({me, economy, onClose, onSaved, onEquipTag, onEquipFrame, onToast}){
  const [name, setName] = useState(me.name || "");
  const [nickname, setNickname] = useState(me.nickname || "");
  const [bio, setBio] = useState(me.bio || "");
  const [emoji, setEmoji] = useState(me.emoji);
  const [color, setColor] = useState(me.color);
  const [preview, setPreview] = useState(me.avatarUrl || null);
  const [avatarFile, setAvatarFile] = useState(undefined);
  const [bannerPreview, setBannerPreview] = useState(me.bannerUrl || null);
  const [bannerFile, setBannerFile] = useState(undefined);
  const [theme, setTheme] = useState(me.theme || "peach");
  const [fontId, setFontId] = useState(me.fontFamily || "fredoka");
  const [gradFrom, setGradFrom] = useState(me.nameGradientFrom || "");
  const [gradTo, setGradTo] = useState(me.nameGradientTo || "");
  const [themePrimary, setThemePrimary] = useState(me.themePrimary || "");
  const [themeSecondary, setThemeSecondary] = useState(me.themeSecondary || "");
  const [song, setSong] = useState(me.song || null);
  const [songQuery, setSongQuery] = useState("");
  const [songResults, setSongResults] = useState([]);
  const [songSearching, setSongSearching] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const fileRef = useRef(null);
  const bannerFileRef = useRef(null);
  const ownedTags = (economy && economy.tags || []).filter(function(t){ return (economy.myTagIds||[]).includes(t.id); });
  const ownedFrames = (economy && economy.frames || []).filter(function(f){ return (economy.myFrameIds||[]).includes(f.id); });

  async function doSongSearch(){
    const q = songQuery.trim();
    if(!q) return;
    setSongSearching(true);
    const results = await window.firebaseApp.searchMusic(q);
    setSongResults(results);
    setSongSearching(false);
  }
  function pickSong(track){
    setSong({title:track.title, artist:track.artist, cover:track.cover, link:track.link});
    setSongResults([]);
    setSongQuery("");
  }

  function handlePhoto(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 300;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.75);
        setPreview(dataUrl);
        setAvatarFile(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function handleBanner(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const w = 600, h = 200;
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        const targetRatio = w/h;
        const srcRatio = img.width/img.height;
        let sw, sh, sx, sy;
        if(srcRatio > targetRatio){ sh = img.height; sw = sh*targetRatio; sx = (img.width-sw)/2; sy = 0; }
        else{ sw = img.width; sh = sw/targetRatio; sx = 0; sy = (img.height-sh)/2; }
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
        setBannerPreview(dataUrl);
        setBannerFile(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  async function save(){
    if(!name.trim()){ setError("Le pseudo ne peut pas être vide"); return; }
    setBusy(true); setError("");
    try{
      const profile = await window.firebaseApp.updateMyProfile(me, {
        name: name.trim().slice(0,18),
        nickname: nickname.trim().slice(0,24) || null,
        bio: bio.trim().slice(0,120) || null,
        emoji: emoji,
        color: color,
        avatarFile: avatarFile,
        bannerFile: bannerFile,
        theme: theme,
        song: song,
        fontFamily: fontId,
        nameGradientFrom: gradFrom || null,
        nameGradientTo: gradTo || null,
        themePrimary: themePrimary || null,
        themeSecondary: themeSecondary || null,
      });
      onSaved(profile);
    }catch(e){ setError(e.message || "Erreur de sauvegarde"); setBusy(false); }
  }

  function surpriseMe(){
    const fonts = ACCOUNT_FONTS.map(function(f){ return f.id; });
    setFontId(fonts[Math.floor(Math.random()*fonts.length)]);
    const palette = ["#FF6FA5","#FF8552","#8C7CF0","#3DDC97","#FFD24C","#241C3D","#00C2FF","#FF4D6D"];
    setGradFrom(palette[Math.floor(Math.random()*palette.length)]);
    setGradTo(palette[Math.floor(Math.random()*palette.length)]);
    setThemePrimary(palette[Math.floor(Math.random()*palette.length)]);
    setThemeSecondary(palette[Math.floor(Math.random()*palette.length)]);
  }
  function removeStyle(){
    setFontId("fredoka");
    setGradFrom(""); setGradTo("");
    setThemePrimary(""); setThemeSecondary("");
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>Modifier mon profil</h3>
        <div style={{textAlign:"center", margin:"14px 0"}}>
          {preview ? (
            <div className="avatar" style={{width:84, height:84, margin:"0 auto", backgroundImage:"url("+preview+")", backgroundSize:"cover", backgroundPosition:"center"}}></div>
          ) : (

function ProfileModal({me, friendsCount, economy, onClose, onAddFriend, onLogout, onOpenEdit, onOpenAdmin, onOpenShop, onOpenQuests, onToast, t, lang, setLang}){
  const [code, setCode] = useState("");
  const [copied, setCopied] = useState(false);
  const [pushState, setPushState] = useState("checking");
  const myTag = me.equippedTag ? (economy.tags||[]).find(function(t){ return t.id===me.equippedTag; }) : null;
  const myFrame = me.equippedFrame ? (economy.frames||[]).find(function(f){ return f.id===me.equippedFrame; }) : null;

  useEffect(() => {
    window.firebaseApp.pushPermissionState().then(setPushState);
  }, []);

  async function togglePush(){
    if(pushState === "subscribed"){
      await window.firebaseApp.unsubscribeFromPush();
      setPushState("default");
      onToast("Notifications désactivées");
    }else{
      try{
        await window.firebaseApp.subscribeToPush();
        setPushState("subscribed");
        onToast("Notifications activées 🔔");
      }catch(e){ onToast(e.message || "Impossible d'activer les notifications"); }

  }

  async function copy(){
    try{
      await navigator.clipboard.writeText(me.code);
      setCopied(true);
      setTimeout(()=>setCopied(false), 1400);
    }catch(e){}
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={me.themePrimary ? {background:"linear-gradient(180deg,"+me.themePrimary+","+(me.themeSecondary||"#fff")+" 140px)"} : {}}>
        <div className="profile-banner" style={me.bannerUrl ? {backgroundImage:"url("+me.bannerUrl+")", backgroundSize:"cover", backgroundPosition:"center"} : {background:me.bannerCss||"linear-gradient(135deg,#FF6FA5,#8C7CF0)"}}></div>
        <button className="modal-close" onClick={onClose} style={{top:14}}>✕</button>
        <div style={{textAlign:"center", marginTop:-38}}>
          <Avatar person={me} size={64} fontSize={28} frame={myFrame ? myFrame.css : null} />

          {myTag && <div style={{marginTop:6}}><TagBadge tag={myTag} /></div>}
          {me.bio && <p className="sub" style={{marginTop:4}}>{me.bio}</p>}
          <p className="sub">{friendsCount} ami{friendsCount>1?"s":""}</p>
          <div style={{display:"flex", gap:8, justifyContent:"center", marginTop:8}}>
            <button className="points-chip" style={{border:"none"}} onClick={onOpenQuests}>⚡ {economy.points} · Quêtes</button>
            <button className="points-chip" style={{border:"none", background:"#EFE6FF"}} onClick={onOpenShop}>🛍️ Boutique</button>

          {me.song && (
            <a href={me.song.link} target="_blank" rel="noopener noreferrer" className="song-card" style={{textDecoration:"none", color:"inherit", marginTop:10}}>
              {me.song.cover && <img src={me.song.cover} className="song-cover" />}
              <div style={{flex:1, minWidth:0, textAlign:"left"}}>
                <div style={{fontWeight:700, fontSize:13}}>{me.song.title}</div>
                <div style={{fontSize:11.5, color:"#8b8397"}}>{me.song.artist}</div>
              </div>
              <span style={{fontSize:18}}>▶️</span>
            </a>
          )}
          <button className="ghost-btn" style={{width:"auto", padding:"9px 16px"}} onClick={onOpenEdit}>✏️ Modifier mon profil</button>
        </div>
        <div style={{textAlign:"center", marginTop:6}}>
          <div className="field-label" style={{textAlign:"left"}}>Ton code ami</div>
          <div className="qr"></div>
          <div className="friend-code-big mono">{me.code}<button className="copy-btn" onClick={copy}>{copied ? "✅" : "📋"}</button></div>
        </div>
        <div className="divider"></div>
        <h3 style={{margin:"0 0 2px"}}>Ajouter un ami</h3>

        <input className="add-input" placeholder="#XXXXX" value={code} onChange={e=>setCode(e.target.value)} maxLength={6} />

        <div className="divider"></div>
        <div className="field-label">Notifications</div>
        {pushState === "unsupported" ? (
          <p className="sub">Pas supporté sur cet appareil/navigateur.</p>

          <button className={"ghost-btn"+(pushState==="subscribed"?" on":"")} style={{width:"auto", padding:"9px 16px", marginBottom:10}} onClick={togglePush}>
            {pushState==="subscribed" ? "🔔 Notifications activées" : "🔕 Activer les notifications"}
          </button>
        )}
        <div className="divider"></div>
        <div className="field-label">{t("profile_language")}</div>
        <div style={{display:"flex", flexWrap:"wrap", gap:6, marginBottom:10}}>
          {AVAILABLE_LANGS.map(l => (
            <button key={l.id} className={"ghost-btn"+(lang===l.id?" on":"")} style={{width:"auto", padding:"7px 14px"}} onClick={()=>setLang(l.id)}>{l.label}</button>

function NewGroupModal({friends, onClose, onCreate}){
  const [name, setName] = useState("");
  const [picked, setPicked] = useState([]);
  const [busy, setBusy] = useState(false);

  function toggle(f){
    setPicked(prev => prev.some(x=>x.code===f.code) ? prev.filter(x=>x.code!==f.code) : [...prev, f]);
  }
  async function create(){
    if(!name.trim() || picked.length===0) return;
    setBusy(true);
    await onCreate(name.trim(), picked);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>Nouveau groupe</h3>
        <p className="sub">Choisis des amis à ajouter</p>
        <input className="name-input" placeholder="Nom du groupe" value={name} onChange={e=>setName(e.target.value)} />
        <div style={{marginTop:14, maxHeight:220, overflowY:"auto"}}>
          {friends.length === 0 && <EmptyState emoji="🙋" text="Ajoute d'abord des amis pour créer un groupe" />}
          {friends.map(f => {
            const on = picked.some(x=>x.code===f.code);
            return (
              <div key={f.code} className={"chip-select"+(on?" on":"")} onClick={()=>toggle(f)}>
                <Avatar person={f} size={30} fontSize={14} />
                <span style={{fontWeight:700, fontSize:13.5}}>{f.name}</span>
                {on && <span style={{marginLeft:"auto"}}>✓</span>}
              </div>
            );
          })}
        </div>
        <button className="primary-btn" disabled={!name.trim() || picked.length===0 || busy} onClick={create}>{busy ? "Création..." : "Créer le groupe"}</button>
      </div>
    </div>
  );
}

/* ============ APP ============ */

function App(){
  const [loadingMe, setLoadingMe] = useState(true);
  const [me, setMe] = useState(null);
  const [tab, setTab] = useState("cam");
  const [lang, setLangState] = useState(detectDeviceLang);
  const t = makeT(lang);
  function setLang(id){
    setLangState(id);
    try{ window.localStorage.setItem("bloop_lang", id); }catch(e){}
  }
  const [social, setSocial] = useState({friends:[], requests:[], groups:[], unread:[]});
  const [openThread, setOpenThread] = useState(null);
  const [toast, setToast] = useState(null);
  const [showProfile, setShowProfile] = useState(false);
  const [showEditProfile, setShowEditProfile] = useState(false);
  const [showNotifs, setShowNotifs] = useState(false);
  const [showNewGroup, setShowNewGroup] = useState(false);
  const [showSonRecorder, setShowSonRecorder] = useState(false);
  const [playingId, setPlayingId] = useState(null);
  const [capturedPhoto, setCapturedPhoto] = useState(null);
  const [capturedClip, setCapturedClip] = useState(null);
  const [feed, setFeed] = useState([]);
  const [clips, setClips] = useState([]);
  const [userSons, setUserSons] = useState([]);
  const [boards, setBoards] = useState([]);
  const [savingPin, setSavingPin] = useState(null);
  const [viewingFriend, setViewingFriend] = useState(null);
  const [groupInfoId, setGroupInfoId] = useState(null);
  const [showAdminPanel, setShowAdminPanel] = useState(false);
  const [onlineCodes, setOnlineCodes] = useState(() => new Set());
  const [commentTarget, setCommentTarget] = useState(null);
  const [shareItem, setShareItem] = useState(null);
  const [economy, setEconomy] = useState({points:0, tags:[], frames:[], myTagIds:[], myFrameIds:[], quiz:null, quizDone:false, quizCorrect:false});
  const [showShop, setShowShop] = useState(false);
  const [showQuests, setShowQuests] = useState(false);

  function showToast(text){ setToast(text); setTimeout(()=>setToast(null), 1900); }

  useEffect(() => {
    const unsub = window.firebaseApp.onAuthChange((profile) => {
      setMe(profile);
      setLoadingMe(false);
    });
    return () => unsub && unsub();
  }, []);

  useEffect(() => {
    if(!me) return;
    (async () => setSocial(await window.firebaseApp.loadSocial(me.code)))();
    (async () => setBoards(await window.firebaseApp.loadBoards(me.code)))();
    refreshEconomy();
  }, [me]);

  async function refreshEconomy(){
    if(!me) return;
    setEconomy(await window.firebaseApp.loadEconomy(me.code));
  }
  async function handleBuyTag(tagId){ await window.firebaseApp.buyTag(tagId); await refreshEconomy(); }
  async function handleBuyFrame(frameId){ await window.firebaseApp.buyFrame(frameId); await refreshEconomy(); }
  async function handleEquipTag(tagId){ try{ await window.firebaseApp.equipTag(tagId); setMe(prev => ({...prev, equippedTag: tagId})); }catch(e){ showToast(e.message || "Erreur"); } }
  async function handleEquipFrame(frameId){ try{ await window.firebaseApp.equipFrame(frameId); setMe(prev => ({...prev, equippedFrame: frameId})); }catch(e){ showToast(e.message || "Erreur"); } }
  async function handleClaimStreak(){ const ok = await window.firebaseApp.claimStreakPoints(); await refreshEconomy(); return ok; }
  async function handleRelightStreak(friend){
    try{
      await window.firebaseApp.relightStreak(friend.code);
      showToast("Flamme rallumée avec "+friend.name+" 🔥");
      setSocial(await window.firebaseApp.loadSocial(me.code));
      await refreshEconomy();
    }catch(e){ showToast(e.message || "Erreur"); }
  }
  async function handleQuizAnswer(qId, idx){ const ok = await window.firebaseApp.claimQuiz(qId, idx); await refreshEconomy(); return ok; }

  useEffect(() => {
    if(!me) return;
    const unsub = window.firebaseApp.subscribePresence(me.code, (codes) => setOnlineCodes(new Set(codes)));
    return unsub;
  }, [me && me.code]);

  useEffect(() => {
    if(tab === "stories") window.firebaseApp.loadFeed().then(setFeed);
    if(tab === "clips") window.firebaseApp.loadClips().then(setClips);
    if(tab === "sons") window.firebaseApp.loadSons().then(setUserSons);
  }, [tab]);

  useEffect(() => {
    const id = setInterval(() => {
      if(me) window.firebaseApp.loadSocial(me.code).then(setSocial);
      if(tab === "stories") window.firebaseApp.loadFeed().then(setFeed);
      if(tab === "clips") window.firebaseApp.loadClips().then(setClips);
      if(tab === "sons") window.firebaseApp.loadSons().then(setUserSons);
    }, 6000);
    return () => clearInterval(id);
  }, [me, tab]);

  useEffect(() => () => stopAnyAudio(), []);

  function openThreadWithPair(t){
    const thread = t.type==="dm" ? {...t, _pair: [me.code, t.code].sort().join("_")} : t;
    setOpenThread(thread);
  }
  function openCommunityThread(c){
    setOpenThread({type:"community", id:c.id, name:c.name, emoji:c.emoji, color:c.color});
    setTab("chat");
  }

  async function handleAddFriend(rawCode){
    const res = await window.firebaseApp.sendFriendRequest(me, rawCode);
    showToast(res.msg);
  }
  async function handleAccept(req){
    const updated = await window.firebaseApp.acceptFriendRequest(me, social, req);
    setSocial(updated);
    showToast(req.name+" est maintenant ton ami·e 🎉");
  }
  async function handleDecline(code){
    const updated = await window.firebaseApp.declineFriendRequest(me, social, code);
    setSocial(updated);
  }
  async function handleCreateGroup(name, members){
    await window.firebaseApp.createGroup(me, name, members);
    const updated = await window.firebaseApp.loadSocial(me.code);
    setSocial(updated);
    setShowNewGroup(false);
    showToast("Groupe \""+name+"\" créé 🎉");
  }
  async function handleLogout(){
    await window.firebaseApp.signOutUser();
    setShowProfile(false);
  }
  function handleProfileSaved(profile){
    setMe(profile);
    setShowEditProfile(false);
    showToast("Profil mis à jour ✨");
  }

  function handlePlaySound(s, isUser){
    if(isUser) playUserSound(s); else playOfficialSound(s);
    setPlayingId(s.id);
  }
  function handleStopSound(){
    stopAnyAudio();
    setPlayingId(null);
  }
  async function handlePublishSon(data){
    const sons = await window.firebaseApp.publishSon(me, data);
    setUserSons(sons);
    setShowSonRecorder(false);
    showToast("Son publié 🎉");
  }

  function handleCaptured(data){
    if(data.kind === "clip") setCapturedClip(data);
    else setCapturedPhoto(data);
  }
  async function handlePublishPhoto(postData){
    const posts = await window.firebaseApp.publishPost(me, postData);
    setFeed(posts);
    setCapturedPhoto(null);
    handleStopSound();
    setTab("stories");
    showToast("Publié ✨");
    if(posts[0]){
      try{
        const got = await window.firebaseApp.claimStoryPoints(posts[0].id);
        if(got){ showToast("+150 ⚡"); refreshEconomy(); }
      }catch(e){}
    }
  }
  async function handlePublishClip(clipData){
    showToast("Envoi du clip...");
    const list = await window.firebaseApp.publishClip(me, clipData);
    setClips(list);
    setCapturedClip(null);
    setTab("clips");
    showToast("Clip publié ✨");
    try{
      const got = await window.firebaseApp.claimClipsMilestone();
      if(got){ showToast("+500 ⚡ (3 clips postés) !"); refreshEconomy(); }
    }catch(e){}
  }
  async function handleLikePost(postId){ setFeed(await window.firebaseApp.toggleLikePost(me, postId)); }
  async function handleDeletePost(postId){
    setFeed(await window.firebaseApp.deletePost(me, postId));
    showToast("Story supprimée");
  }
  async function handleLikeClip(clipId){ setClips(await window.firebaseApp.toggleLikeClip(me, clipId)); }
  async function handleDeleteClip(clipId){
    setClips(await window.firebaseApp.deleteClip(me, clipId));
    showToast("Clip supprimé");
  }

  async function handleSaveBoard(target){
    const updated = await window.firebaseApp.saveToBoard(me.code, target, savingPin);
    setBoards(updated);
    setSavingPin(null);
    showToast("Enregistré ✨");
  }

  if(loadingMe){
    return <div className="phone" style={{alignItems:"center", justifyContent:"center"}}><div style={{fontSize:13, color:"#8b8397"}}>Chargement...</div></div>;
  }
  if(!me){
    return <div className="phone"><AuthScreen onAuthed={setMe} t={t} lang={lang} setLang={setLang} /></div>;
  }
  if(me.banned){
    return (
      <div className="phone" style={{alignItems:"center", justifyContent:"center", padding:30, textAlign:"center"}}>
        <div style={{fontSize:40, marginBottom:10}}>🚫</div>
        <h3 style={{margin:"0 0 8px"}}>Compte suspendu</h3>
        <p className="sub">Ton compte a été banni de Bloop.</p>
        <button className="ghost-btn" style={{marginTop:16, width:"auto", padding:"10px 20px"}} onClick={handleLogout}>Se déconnecter</button>
      </div>
    );
  }

  const pendingCount = (social.requests||[]).length;

  return (
    <div className="phone" style={themeVars(me.theme)}>
      {tab !== "cam" && <TopBar me={me} pending={pendingCount} points={economy.points} onProfile={()=>setShowProfile(true)} onNotifs={()=>setShowNotifs(true)} onOpenQuests={()=>setShowQuests(true)} />}

      <div className={"content"+(tab==="cam"?" no-pad":"")}>
        {tab === "chat" && !openThread && <ChatListView social={social} onOpenThread={openThreadWithPair} onNewGroup={()=>setShowNewGroup(true)} onViewProfile={setViewingFriend} onlineCodes={onlineCodes} tagDefs={economy.tags} frameDefs={economy.frames} onRelight={handleRelightStreak} t={t} />}
        {tab === "chat" && openThread && <ChatThreadView me={me} thread={openThread} onBack={()=>{ setOpenThread(null); window.firebaseApp.loadSocial(me.code).then(setSocial); }} onViewProfile={setViewingFriend} onOpenGroupInfo={setGroupInfoId} onToast={showToast} onlineCodes={onlineCodes} />}
        {tab === "clips" && <ClipsView me={me} clips={clips} onLike={handleLikeClip} onDelete={handleDeleteClip} onComment={(clip)=>setCommentTarget({clipId:clip.id})} onShare={(clip)=>setShareItem({type:"clip", id:clip.id, authorName:clip.authorName, authorEmoji:clip.authorEmoji, video:clip.video, caption:clip.caption})} onGoRecord={()=>setTab("cam")} tagDefs={economy.tags} t={t} />}
        {tab === "sons" && <SonsView playingId={playingId} onPlay={handlePlaySound} onStop={handleStopSound} userSons={userSons} onOpenRecorder={()=>setShowSonRecorder(true)} />}
        {tab === "cam" && (
          <CameraView
            me={me}
            pending={pendingCount}
            onCaptured={handleCaptured}
            onGoChat={()=>setTab("chat")}
            onOpenProfile={()=>setShowProfile(true)}
            onToast={showToast}
          />
        )}
        {tab === "stories" && (
          <StoriesView me={me} feed={feed} onLike={handleLikePost} onGoCam={()=>setTab("cam")} onPlaySound={(id)=>{ const s=SONS.find(x=>x.id===id); if(s) handlePlaySound(s, false); }} onViewProfile={setViewingFriend} onDelete={handleDeletePost} onComment={(post)=>setCommentTarget({postId:post.id})} onShare={(post)=>setShareItem({type:"post", id:post.id, authorName:post.authorName, authorEmoji:post.authorEmoji, img:post.img, bg:post.bg, emojiBg:post.emojiBg, caption:post.caption})} tagDefs={economy.tags} t={t} />
        )}
        {tab === "decouvre" && <DiscoverView me={me} boards={boards} onOpenSave={setSavingPin} onOpenCommunity={openCommunityThread} onToast={showToast} />}
      </div>

      <BottomNav tab={tab} setTab={(t2)=>{ setTab(t2); if(t2==="chat") setOpenThread(null); }} t={t} />

      {showProfile && <ProfileModal me={me} friendsCount={(social.friends||[]).length} economy={economy} onClose={()=>setShowProfile(false)} onAddFriend={handleAddFriend} onLogout={handleLogout} onOpenEdit={()=>{setShowProfile(false); setShowEditProfile(true);}} onOpenAdmin={()=>{setShowProfile(false); setShowAdminPanel(true);}} onOpenShop={()=>{setShowProfile(false); setShowShop(true);}} onOpenQuests={()=>{setShowProfile(false); setShowQuests(true);}} onToast={showToast} t={t} lang={lang} setLang={setLang} />}
      {showEditProfile && <EditProfileModal me={me} economy={economy} onClose={()=>setShowEditProfile(false)} onSaved={handleProfileSaved} onEquipTag={handleEquipTag} onEquipFrame={handleEquipFrame} onToast={showToast} />}
      {showNotifs && <NotificationsPanel requests={social.requests||[]} onAccept={handleAccept} onDecline={handleDecline} onClose={()=>setShowNotifs(false)} />}
      {showNewGroup && <NewGroupModal friends={social.friends||[]} onClose={()=>setShowNewGroup(false)} onCreate={handleCreateGroup} />}
      {showSonRecorder && <SonRecorderModal onClose={()=>setShowSonRecorder(false)} onPublish={handlePublishSon} onToast={showToast} />}
      {capturedPhoto && (
        <PhotoComposerModal captured={capturedPhoto} playingId={playingId} onPlay={(s)=>handlePlaySound(s,false)} onStop={handleStopSound} onClose={()=>{setCapturedPhoto(null); handleStopSound();}} onPublish={handlePublishPhoto} onToast={showToast} />
      )}
      {capturedClip && (
        <ClipComposerModal clip={capturedClip} onClose={()=>setCapturedClip(null)} onPublish={handlePublishClip} onToast={showToast} />
      )}
      {savingPin && <BoardPickerModal boards={boards} onClose={()=>setSavingPin(null)} onSave={handleSaveBoard} />}
      {viewingFriend && <FriendProfileModal friend={viewingFriend} tagDefs={economy.tags} frameDefs={economy.frames} onClose={()=>setViewingFriend(null)} />}
      {groupInfoId && <GroupInfoModal me={me} groupId={groupInfoId} friends={social.friends||[]} onClose={()=>setGroupInfoId(null)} onToast={showToast} />}
      {showShop && <ShopModal me={me} economy={economy} onClose={()=>setShowShop(false)} onToast={showToast} onBuyTag={handleBuyTag} onBuyFrame={handleBuyFrame} onEquipTag={handleEquipTag} onEquipFrame={handleEquipFrame} t={t} />}
      {showQuests && <QuestsModal me={me} economy={economy} onClose={()=>setShowQuests(false)} onToast={showToast} onClaimStreak={handleClaimStreak} onQuizAnswer={handleQuizAnswer} t={t} />}
      {commentTarget && <CommentsModal me={me} target={commentTarget} onClose={()=>setCommentTarget(null)} onToast={showToast} t={t} />}
      {shareItem && <SharePickerModal me={me} item={shareItem} friends={social.friends||[]} onClose={()=>setShareItem(null)} onToast={showToast} t={t} />}
      {showAdminPanel && <AdminPanelModal onClose={()=>setShowAdminPanel(false)} onToast={showToast} tagDefs={economy.tags} frameDefs={economy.frames} />}

      <Toast text={toast} />
    </div>
  );
}

function boot(){
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
if(window.firebaseApp){ boot(); } else { window.__startBloopApp = boot; }
</script>
</body>
</html>
