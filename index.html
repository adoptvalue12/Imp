function genCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return "#" + c;
}
function normalizeCode(raw){
  let c = (raw||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!c.startsWith("#")) c = "#"+c;
  return c;
}
function friendlyAuthError(e){
  const msg = (e && e.message) || "";
  if(msg.indexOf("already registered") !== -1 || msg.indexOf("already been registered") !== -1) return "Cet email a déjà un compte — essaie de te connecter plutôt.";
  if(msg.indexOf("Password should be at least") !== -1) return "Mot de passe trop court (6 caractères minimum).";
  if(msg.indexOf("Invalid email") !== -1) return "Adresse email invalide.";
  if(msg.indexOf("Invalid login credentials") !== -1) return "Email ou mot de passe incorrect.";
  if(msg.indexOf("rate limit") !== -1 || msg.indexOf("Too many") !== -1) return "Trop d'essais — réessaie dans un instant.";
  return msg || "Une erreur est survenue. Réessaie.";
}

async function getMyProfile(){

async function signUp(opts){
  const email = opts.email, password = opts.password, name = opts.name, emoji = opts.emoji, color = opts.color;
  const su = await supabase.auth.signUp({
    email: email,
    password: password,
    options: { data: { name: name, emoji: emoji, color: color } }
  });
  if(su.error) throw new Error(friendlyAuthError(su.error));
  if(!su.data.user) throw new Error("Erreur d'inscription — réessaie.");
  if(!su.data.session){
    return { pending: true };
  }
  const profile = await getMyProfile();
  if(!profile) throw new Error("Compte créé mais profil introuvable — réessaie de te connecter dans quelques secondes.");
  return profile;
}
async function signIn(opts){

}

async function fetchTagFrameMap(codes){
  const uniq = codes.filter(function(c,i,arr){ return c && arr.indexOf(c)===i; });
  if(uniq.length === 0) return {};
  const r = await supabase.from("profiles").select("code,equipped_tag,equipped_frame,font_family,name_gradient_from,name_gradient_to").in("code", uniq);
  const map = {};
  (r.data || []).forEach(function(p){ map[p.code] = {equippedTag:p.equipped_tag, equippedFrame:p.equipped_frame, fontFamily:p.font_family, nameGradientFrom:p.name_gradient_from, nameGradientTo:p.name_gradient_to}; });
  return map;
}
async function loadSocial(code){
  const results = await Promise.all([
    supabase.from("friendships").select("friend_code,friend_name,friend_emoji,friend_color,friend_avatar_url").eq("owner_code", code),
    supabase.from("friend_requests").select("id,from_code,from_name,from_emoji,from_color,from_avatar_url").eq("to_code", code),
    supabase.from("group_members").select("group_id, groups(name, emoji)").eq("member_code", code),
    supabase.from("thread_unread").select("thread_key").eq("user_code", code),
    supabase.from("friend_streaks").select("code_a,code_b,count,streak_counted_date").or("code_a.eq."+code+",code_b.eq."+code),
  ]);
  const friendsRows = results[0].data || [];
  const requestsRows = results[1].data || [];
  const memberRows = results[2].data || [];
  const unreadRows = results[3].data || [];
  const streakRows = results[4].data || [];
  const todayStr = new Date().toISOString().slice(0,10);
  const yestStr = new Date(Date.now()-86400000).toISOString().slice(0,10);
  const streakMap = {};
  const deadStreakMap = {};
  streakRows.forEach(function(s){
    const other = s.code_a === code ? s.code_b : s.code_a;
    const alive = s.streak_counted_date === todayStr || s.streak_counted_date === yestStr;
    streakMap[other] = alive ? s.count : 0;
    if(!alive && s.count > 0) deadStreakMap[other] = s.count;
  });
  const tfMap = await fetchTagFrameMap(friendsRows.map(function(f){ return f.friend_code; }));
  const friends = friendsRows.map(function(f){
    const tf = tfMap[f.friend_code] || {};
    return {code:f.friend_code, name:f.friend_name, emoji:f.friend_emoji, color:f.friend_color, avatarUrl:f.friend_avatar_url, streak: streakMap[f.friend_code] || 0, deadStreak: deadStreakMap[f.friend_code] || 0, equippedTag: tf.equippedTag || null, equippedFrame: tf.equippedFrame || null, fontFamily: tf.fontFamily || null, nameGradientFrom: tf.nameGradientFrom || null, nameGradientTo: tf.nameGradientTo || null};
  });
  const requests = requestsRows.map(function(r){ return {id:r.id, code:r.from_code, name:r.from_name, emoji:r.from_emoji, color:r.from_color, avatarUrl:r.from_avatar_url}; });
  const groups = memberRows.map(function(g){
    const gg = g.groups || {};
    return {id:g.group_id, name: gg.name || "Groupe", emoji: gg.emoji || "👥"};
  });
  const unread = unreadRows.map(function(u){ return u.thread_key; });
  return { friends: friends, requests: requests, groups: groups, unread: unread };
}

function threadKeyOf(thread){ return (thread.type === "group" || thread.type === "community") ? thread.id : thread._pair; }

async function loadThread(me, thread){
  const tkey = threadKeyOf(thread);
  const msgsPromise = supabase.from("messages").select("id,from_code,body,image,audio,reactions,created_at,view_once,opened,kept,location,is_sticker,shared_post").eq("thread_key", tkey).order("created_at", {ascending:true}).limit(300);
  const membersPromise = thread.type === "group"
    ? supabase.from("group_members").select("member_code,member_name,member_emoji,member_color,member_avatar_url").eq("group_id", thread.id)
    : Promise.resolve({data:null});
  const readsPromise = thread.type === "dm"
    ? supabase.from("thread_reads").select("user_code,last_read_at").eq("thread_key", tkey)
    : Promise.resolve({data:null});
  const results = await Promise.all([msgsPromise, membersPromise, readsPromise]);
  await supabase.rpc("mark_thread_read", { p_thread_key: tkey });

  const messages = (results[0].data || []).map(function(m){
    return {id:m.id, from:m.from_code, text:m.body, image:m.image, audio:m.audio, ts:new Date(m.created_at).getTime(), reactions:m.reactions||[], viewOnce:m.view_once, opened:m.opened, kept:m.kept, location:m.location, isSticker:m.is_sticker, sharedPost:m.shared_post};
  });
  let members = results[1].data ? results[1].data.map(function(mm){
    return {code:mm.member_code, name:mm.member_name, emoji:mm.member_emoji, color:mm.member_color, avatarUrl:mm.member_avatar_url};
  }) : [];
  if(thread.type === "community"){
    const codes = Array.from(new Set(messages.map(function(m){ return m.from; })));
    if(codes.length > 0){
      const pr = await supabase.from("profiles").select("code,name,emoji,color,avatar_url").in("code", codes);
      members = (pr.data||[]).map(function(p){ return {code:p.code, name:p.name, emoji:p.emoji, color:p.color, avatarUrl:p.avatar_url}; });
    }
  }
  const readBy = {};
  if(results[2].data){
    results[2].data.forEach(function(r){ readBy[r.user_code] = new Date(r.last_read_at).getTime(); });
  }
  return { messages: messages, members: members, readBy: readBy };
}

    type: item.type, id: item.id, authorName: item.authorName, authorEmoji: item.authorEmoji,
    img: item.img || null, bg: item.bg || null, emojiBg: item.emojiBg || null, caption: item.caption || null,
    video: item.video || null,
  };
  const bodyText = item.type === "clip" ? "📤 a partagé un clip" : "📤 a partagé une story";
  for(let i=0;i<codes.length;i++){
    const pair = [me.code, codes[i]].sort().join("_");
    const r = await supabase.rpc("send_message", {
      p_thread_key: pair, p_body: bodyText, p_is_group: false, p_other_code: codes[i], p_shared_post: snapshot,
    });
    if(r.error) throw new Error(r.error.message);
  }
}

async function loadClips(){
  const res = await supabase.from("clips").select("*").order("created_at", {ascending:false}).limit(20);
  const clips = res.data || [];
  const ids = clips.map(function(c){ return c.id; });
  let counts = {};
  if(ids.length){
    const cres = await supabase.from("comments").select("clip_id").in("clip_id", ids);
    (cres.data || []).forEach(function(c){ counts[c.clip_id] = (counts[c.clip_id]||0) + 1; });
  }
  const tfMap = await fetchTagFrameMap(clips.map(function(c){ return c.author_code; }));
  return clips.map(function(c){
    const tf = tfMap[c.author_code] || {};
    return {
      id:c.id, authorCode:c.author_code, authorName:c.author_name, authorEmoji:c.author_emoji, authorColor:c.author_color,
      video:c.video_url, caption:c.caption, likes:c.likes || [], ts:new Date(c.created_at).getTime(),
      commentCount: counts[c.id] || 0, authorTag: tf.equippedTag || null, authorFrame: tf.equippedFrame || null, authorFont: tf.fontFamily || null,
      authorNameFrom: tf.nameGradientFrom || null, authorNameTo: tf.nameGradientTo || null,
    };
  });
}
async function uploadClipVideo(code, dataUrl){
  const fetched = await fetch(dataUrl);
  const blob = await fetched.blob();
  const path = code.replace("#","") + "/" + Date.now() + ".webm";
  const up = await supabase.storage.from("clips").upload(path, blob, { contentType: blob.type || "video/webm" });
  if(up.error) throw new Error("Erreur d'envoi vidéo : " + up.error.message);
  const pub = supabase.storage.from("clips").getPublicUrl(path);
  return pub.data.publicUrl;
}
async function publishClip(me, clipData){
  const url = await uploadClipVideo(me.code, clipData.video);
  const r = await supabase.from("clips").insert({
    author_code: me.code, author_name: me.name, author_emoji: me.emoji, author_color: me.color,
    video_url: url, caption: clipData.caption || null,
  });
  if(r.error) throw new Error(r.error.message);
  notifyMyFriends("clip", me.code);
  return await loadClips();
}

async function loadEconomy(meCode){
  const [ptsRes, tagDefsRes, frameDefsRes, myTagsRes, myFramesRes, quizQRes, quizStatusRes] = await Promise.all([
    supabase.rpc("my_points"),
    supabase.from("tag_defs").select("*").order("price", {ascending:true, nullsFirst:true}),
    supabase.from("frame_defs").select("*").order("price", {ascending:true}),
    supabase.from("user_tags").select("tag_id,expires_at").eq("user_code", meCode),
    supabase.from("user_frames").select("frame_id,expires_at").eq("user_code", meCode),
    supabase.rpc("today_quiz_question"),
    supabase.rpc("my_quiz_status"),
  ]);
  const now = Date.now();
  const myTagIds = (myTagsRes.data||[]).filter(function(t){ return !t.expires_at || new Date(t.expires_at).getTime()>now; }).map(function(t){ return t.tag_id; });
  const myFrameIds = (myFramesRes.data||[]).filter(function(f){ return !f.expires_at || new Date(f.expires_at).getTime()>now; }).map(function(f){ return f.frame_id; });
  const myTagExpiry = {}; (myTagsRes.data||[]).forEach(function(t){ myTagExpiry[t.tag_id] = t.expires_at || null; });
  const myFrameExpiry = {}; (myFramesRes.data||[]).forEach(function(f){ myFrameExpiry[f.frame_id] = f.expires_at || null; });
  const q = quizQRes.data && quizQRes.data[0];
  const qs = quizStatusRes.data && quizStatusRes.data[0];
  return {
    points: ptsRes.data || 0,
    tags: (tagDefsRes.data||[]).map(function(t){ return {id:t.id, label:t.label, emoji:t.emoji, color:t.color, price:t.price}; }),
    frames: (frameDefsRes.data||[]).map(function(f){ return {id:f.id, label:f.label, css:f.css, price:f.price}; }),
    myTagIds: myTagIds, myFrameIds: myFrameIds, myTagExpiry: myTagExpiry, myFrameExpiry: myFrameExpiry,
    quiz: q ? {id:q.id, question:q.question, options:q.options, points:q.points} : null,
    quizDone: qs ? qs.done : false,
    quizCorrect: qs ? qs.was_correct : false,
  };
}

const VAPID_PUBLIC_KEY = "BKL5REeGSM2dq5Yq2y4-HXOaKWSEdolYHsjd_55JFZMCheDI_FE1Ntm5zLfCBqOCofHJmXFsaVWijv-Ei-bfHd8";
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function pushSupported(){
  return !!(typeof window !== "undefined" && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window);
}
async function pushPermissionState(){
  if(!pushSupported()) return "unsupported";
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    if(!reg) return Notification.permission === "granted" ? "granted-not-subscribed" : Notification.permission;
    const sub = await reg.pushManager.getSubscription();
    if(sub) return "subscribed";
    return Notification.permission;
  }catch(e){ return Notification.permission || "default"; }
}
async function subscribeToPush(){
  if(!pushSupported()) throw new Error("Les notifications ne sont pas supportées sur cet appareil");
  const permission = await Notification.requestPermission();
  if(permission !== "granted") throw new Error("Permission refusée");
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }
  const json = sub.toJSON();
  const r = await supabase.rpc("upsert_push_subscription", {
    p_endpoint: json.endpoint, p_p256dh: json.keys.p256dh, p_auth: json.keys.auth,
  });
  if(r.error) throw new Error(r.error.message);
  return true;
}
async function unsubscribeFromPush(){
  if(!pushSupported()) return;
  const reg = await navigator.serviceWorker.getRegistration();
  if(!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if(sub){
    const endpoint = sub.endpoint;
    try{ await sub.unsubscribe(); }catch(e){}
    try{ await supabase.rpc("remove_push_subscription", {p_endpoint: endpoint}); }catch(e){}
  }
}
async function triggerPush(kind, recipientCodes){
  if(!recipientCodes || recipientCodes.length === 0) return;
  try{
    const sess = await supabase.auth.getSession();
    const token = sess.data && sess.data.session && sess.data.session.access_token;
    if(!token) return;
    await fetch(SUPABASE_URL + "/functions/v1/send-push", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ kind: kind, recipient_codes: recipientCodes }),
    });
  }catch(e){ /* best-effort: a failed push must never block the underlying action */ }
}

  }).subscribe(async function(status){

  return function(){ supabase.removeChannel(channel); };
}

async function loadBoards(code){
  const br = await supabase.from("boards").select("id,name").eq("owner_code", code);
  const boardRows = br.data || [];
  const out = [];
  for(let i=0;i<boardRows.length;i++){
    const b = boardRows[i];
    const pr = await supabase.from("board_pins").select("pin").eq("board_id", b.id).order("created_at", {ascending:false});
    out.push({ id:b.id, name:b.name, pins: (pr.data||[]).map(function(p){ return p.pin; }) });
  }
  return out;
}
async function saveToBoard(code, target, pin){
  let boardId = target.id;
  if(target.newName){
    const br = await supabase.from("boards").insert({ owner_code: code, name: target.newName }).select().single();
    if(br.error) throw new Error(br.error.message);
    boardId = br.data.id;
  }
  const pr = await supabase.from("board_pins").insert({ board_id: boardId, pin: pin });
  if(pr.error) throw new Error(pr.error.message);
  return await loadBoards(code);
}

  .navbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:14px;cursor:pointer;color:#9b93a8;font-weight:700;font-size:9.5px;}
  .navbtn.active{color:var(--ink);background:#FFEFE0;}
  .navicon{font-size:18px;line-height:1;}

  .sect-head{padding:2px 20px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .sect-head h2{margin:0;font-size:21px;font-weight:600;}
  .sect-head p{margin:3px 0 0;font-size:12.5px;color:#8b8397;}
  .mini-btn{background:var(--ink);color:#fff;border:none;font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:14px;cursor:pointer;white-space:nowrap;}

  .empty-state{margin:20px 20px;padding:26px 20px;background:#fff;border:1.5px dashed var(--line);border-radius:20px;text-align:center;}
  .empty-state .e{font-size:30px;margin-bottom:8px;}
  .empty-state p{font-size:13px;color:#8b8397;margin:0;line-height:1.5;}

  /* ===== CHAT ===== */
  .list-label{padding:14px 20px 4px;font-size:11.5px;font-weight:700;color:#a89fb5;text-transform:uppercase;letter-spacing:.04em;}
  .tab-row{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto;}
  .tab-pill{flex-shrink:0;background:#F1EAE0;color:#8b8397;border:none;font-weight:700;font-size:12px;padding:8px 14px;border-radius:16px;cursor:pointer;white-space:nowrap;}
  .tab-pill.on{background:var(--ink);color:#fff;}
  .unread-dot{width:10px;height:10px;border-radius:50%;background:var(--pink);flex-shrink:0;}
  .streak-chip{font-size:11px;font-weight:700;color:var(--coral);margin-left:6px;}
  .streak-chip.dead{color:#8b8397;cursor:pointer;text-decoration:underline;}
  .friend-row{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;}
  .friend-row:active{background:#FFF1E6;}
  .avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;position:relative;}
  .avatar .status{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--mint);border:2px solid var(--cream);}
  .friend-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:5px;}
  .friend-msg{font-size:12.5px;color:#8b8397;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .friend-time{font-size:10.5px;color:#b3abc0;white-space:nowrap;}

  .chat-view{display:flex;flex-direction:column;height:calc(100vh - 88px);}
  .chat-head{display:flex;align-items:center;gap:10px;padding:8px 18px 12px;border-bottom:1px solid var(--line);}
  .backbtn{background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink);padding:4px;}
  .bubble-list{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:4px;}
  .bubble-row{display:flex;flex-direction:column;margin-bottom:8px;}
  .bubble-row.me{align-items:flex-end;}
  .bubble-row.them{align-items:flex-start;}
  .grp-sender{font-size:10.5px;color:#a89fb5;font-weight:700;margin:0 4px 3px;}
  .bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.4;position:relative;cursor:pointer;word-wrap:break-word;}
  .bubble.me{background:var(--ink);color:var(--cream);border-bottom-right-radius:6px;}
  .bubble.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;}
  .reaction-pill{font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:1px 6px;margin-top:3px;display:inline-flex;align-items:center;gap:3px;}
  .read-note{font-size:10.5px;color:#b3abc0;margin:2px 4px 0;}
  .online-dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--mint);border:2px solid #fff;}
  .online-label{font-size:10.5px;color:var(--mint);font-weight:700;}
  .bubble-line{display:flex;align-items:center;gap:6px;}
  .bubble-line.mine{flex-direction:row-reverse;}
  .msg-delete-btn{background:none;border:none;font-size:11px;color:#b3abc0;cursor:pointer;padding:2px 4px;white-space:nowrap;}
  .shared-post-card{display:flex;align-items:center;gap:8px;max-width:75%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;}
  .shared-post-media{width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .shared-post-info{min-width:0;}
  .shared-post-author{font-size:12px;font-weight:700;}
  .shared-post-caption{font-size:11.5px;color:#8a8195;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .composer{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff;}
  .composer input{flex:1;border:1px solid var(--line);border-radius:22px;padding:11px 16px;font-family:'Quicksand',sans-serif;font-size:14px;outline:none;}
  .composer input:focus{border-color:var(--pink);}
  .sendbtn{background:var(--pink);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;touch-action:none;-webkit-user-select:none;user-select:none;}
  .sendbtn:disabled{opacity:.4;}
  .recording-mic{background:#FF4D4D !important;animation:pulse 1s ease-in-out infinite;font-size:11px !important;font-weight:700;}
  .voice-msg{max-width:210px;height:36px;}
  .snap-btn{background:#F1EAE0;border:none;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;}
  .chat-snap{max-width:70%;border-radius:16px;cursor:pointer;display:block;}
  .location-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 14px;border-radius:16px;font-size:13px;font-weight:700;}
  .sticker-msg{font-size:52px;line-height:1;cursor:pointer;}
  .snap-placeholder{background:var(--ink);color:#fff;padding:16px 20px;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;text-align:center;}
  .keep-btn{display:block;margin-top:6px;background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-size:11px;font-weight:700;padding:7px 12px;border-radius:12px;cursor:pointer;}
  .attach-menu{display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--line);background:#fff;}
  .mic-issue-banner{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#FFF1E0;border-top:1px solid #FFD9A8;font-size:12px;color:#7A4A00;}
  .mic-issue-banner span{flex:1;}
  .mic-issue-banner button{background:none;border:none;color:#7A4A00;font-size:13px;cursor:pointer;}
  .attach-menu button{flex:1;background:var(--cream);border:none;border-radius:14px;padding:10px 6px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .sticker-picker{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#fff;}
  .sticker-pick-btn{background:var(--cream);border:none;border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;}

  /* ===== CLIPS ===== */
  .clips-feed{height:calc(100vh - 88px);overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;}
  .clip{height:calc(100vh - 88px);scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;color:#fff;padding:0 20px 26px;overflow:hidden;}
  .clip-info{position:relative;z-index:2;}
  .clip-info .who{font-weight:700;font-size:15px;margin-bottom:4px;}
  .clip-info .cap{font-size:13px;opacity:.92;max-width:78%;}
  .clip-side{position:absolute;right:12px;bottom:96px;z-index:2;display:flex;flex-direction:column;gap:16px;align-items:center;}
  .clip-side button{background:none;border:none;color:#fff;cursor:pointer;padding:0;}
  .clip-side .ico{font-size:23px;display:block;}
  .clip-side .num{font-size:10.5px;font-weight:700;margin-top:3px;}
  .clip-play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;z-index:1;opacity:.92;filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));}
  .clip-empty{height:100%;display:flex;align-items:center;justify-content:center;padding:0 30px;}
  .clip-empty-inner{text-align:center;color:#fff;}
  .clip-empty-inner .e{font-size:40px;margin-bottom:10px;}
  .clip-empty-inner p{font-size:13.5px;opacity:.85;margin:0 0 16px;line-height:1.5;}

  /* ===== SONS ===== */
  .sound-row{display:flex;align-items:center;gap:12px;padding:11px 20px;}
  .sound-art{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
  .eq{display:flex;align-items:flex-end;gap:2px;height:16px;}
  .eq span{width:3px;background:#fff;border-radius:2px;animation:eq 0.9s ease-in-out infinite;}
  .eq span:nth-child(1){animation-delay:0s;height:6px;}
  .eq span:nth-child(2){animation-delay:.2s;height:14px;}
  .eq span:nth-child(3){animation-delay:.1s;height:9px;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
  .sound-title{font-weight:700;font-size:14px;}
  .sound-artist{font-size:12px;color:#8b8397;}
  .play-btn{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .use-btn{background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-size:11px;font-weight:700;padding:6px 10px;border-radius:12px;cursor:pointer;flex-shrink:0;}
  .record-btn-big{width:76px;height:76px;border-radius:50%;background:var(--pink);border:none;color:#fff;font-size:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .rec-pulse{animation:pulse 1s ease-in-out infinite;background:#FF4D4D !important;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  /* ===== STORIES / FEED ===== */
  .stories-strip{display:flex;gap:13px;padding:6px 20px 16px;overflow-x:auto;}
  .story{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
  .story-ring{width:58px;height:58px;border-radius:50%;padding:3px;display:flex;align-items:center;justify-content:center;font-size:22px;}
  .story span{font-size:10.5px;font-weight:600;color:#655d72;}
  .feed-card{margin:0 20px 18px;background:#fff;border-radius:22px;overflow:hidden;border:1px solid var(--line);}
  .feed-user-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0;}
  .feed-user{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
  .delete-post-btn{background:none;border:none;font-size:13px;color:#b3abc0;cursor:pointer;padding:4px 6px;}
  .feed-img{height:320px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;overflow:hidden;background-size:cover;background-position:center;cursor:pointer;}
  .heart-pop{position:absolute;top:50%;left:50%;font-size:80px;transform:translate(-50%,-50%) scale(0.4);opacity:0;pointer-events:none;animation:heartpop .65s ease forwards;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
  @keyframes heartpop{0%{transform:translate(-50%,-50%) scale(0.4);opacity:0;}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}55%{transform:translate(-50%,-50%) scale(0.95);opacity:1;}100%{transform:translate(-50%,-50%) scale(1);opacity:0;}}
  .feed-body{padding:10px 16px 14px;}
  .feed-actions{display:flex;align-items:center;gap:16px;margin-top:8px;font-size:19px;}
  .feed-actions button{background:none;border:none;font-size:19px;cursor:pointer;padding:0;color:inherit;}
  .feed-caption{font-size:13px;color:#4a4356;}
  .hashtag{color:var(--pink);font-weight:700;}
  .post-sound-chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:4px 9px;font-size:11px;font-weight:700;margin-top:8px;cursor:pointer;}

  /* ===== DECOUVRE ===== */
  .boards-strip{display:flex;gap:10px;padding:0 20px 16px;overflow-x:auto;}
  .board-chip{flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-width:88px;cursor:pointer;}
  .board-chip .n{font-size:12.5px;font-weight:700;}
  .board-chip .c{font-size:10.5px;color:#8b8397;}
  .masonry{column-count:2;column-gap:12px;padding:0 20px;}
  .mcard{break-inside:avoid;margin-bottom:12px;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);position:relative;}
  .mimg{display:flex;align-items:center;justify-content:center;font-size:38px;}
  .mtitle{padding:10px 12px 12px;font-size:12px;font-weight:600;}
  .save-btn{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;border:none;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:14px;cursor:pointer;}

  /* ===== MODALS ===== */
  .overlay{position:fixed;inset:0;background:rgba(36,28,61,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:26px;padding:26px 22px;max-width:340px;width:100%;position:relative;max-height:85vh;overflow-y:auto;}
  .profile-banner{margin:-26px -22px 0;height:88px;border-radius:26px 26px 0 0;background-size:cover;background-position:center;}
  .name-style-preview{border-radius:14px;padding:16px;text-align:center;font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;margin-top:6px;}
  .color-input{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);padding:2px;background:#fff;cursor:pointer;}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;cursor:pointer;color:#aaa;}
  .modal h3{margin:4px 0 2px;font-size:17px;}
  .modal .sub{font-size:12px;color:#8b8397;margin:0;}

  .qr{width:150px;height:150px;margin:14px auto;background:repeating-linear-gradient(45deg, var(--ink) 0 4px, transparent 4px 8px),repeating-linear-gradient(-45deg, var(--ink) 0 4px, transparent 4px 8px);background-blend-mode:multiply;border-radius:16px;border:6px solid var(--ink);position:relative;}
  .qr::before{content:"";position:absolute;inset:0;background:#fff;opacity:.08;}
  .friend-code-big{font-size:20px;font-weight:700;letter-spacing:2px;background:var(--cream);padding:9px 14px;border-radius:14px;margin-top:4px;display:inline-flex;align-items:center;gap:8px;}
  .copy-btn{background:none;border:none;font-size:14px;cursor:pointer;}
  .add-input{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:center;font-size:15px;letter-spacing:2px;margin-top:12px;outline:none;text-transform:uppercase;}
  .add-input:focus{border-color:var(--pink);}
  .primary-btn{background:var(--pink);color:#fff;border:none;padding:13px;border-radius:16px;font-weight:700;font-size:14px;width:100%;margin-top:10px;cursor:pointer;font-family:'Quicksand',sans-serif;}
  .primary-btn:disabled{opacity:.45;}
  .ghost-btn{background:#F1EAE0;color:var(--ink);border:none;padding:13px;border-radius:16px;font-weight:700;font-size:14px;width:100%;margin-top:8px;cursor:pointer;}
  .divider{margin:18px 0;height:1px;background:var(--line);}

  .req-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .tag-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap;}
  .quest-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FBF6EF;border-radius:14px;padding:10px 12px;}
  .quest-pts{font-size:13px;font-weight:800;color:var(--coral);white-space:nowrap;}
  .points-chip{font-size:12px;font-weight:800;color:var(--ink);background:#FFE9A8;border-radius:12px;padding:4px 10px;display:inline-flex;align-items:center;gap:3px;}
  .req-row:last-child{border-bottom:none;}
  .req-actions{display:flex;gap:6px;margin-left:auto;}
  .accept-btn{background:var(--mint);color:#fff;border:none;font-size:11px;font-weight:700;padding:7px 10px;border-radius:12px;cursor:pointer;}
  .decline-btn{background:#F1EAE0;color:#8b8397;border:none;font-size:11px;font-weight:700;padding:7px 10px;border-radius:12px;cursor:pointer;}

  .chip-select{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:7px;cursor:pointer;}
  .chip-select.on{border-color:var(--pink);background:#FFF1E6;}
  .name-input{width:100%;border:2px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14px;margin-top:4px;outline:none;font-family:'Quicksand',sans-serif;}
  .name-input:focus{border-color:var(--pink);}

  .toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;animation:up .25s ease;max-width:88%;text-align:center;}
  @keyframes up{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  /* ===== ONBOARDING ===== */
  .onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 26px;}
  .onboard h1{font-size:30px;margin:0 0 6px;}
  .onboard .tag{font-size:13.5px;color:#8b8397;margin:0 0 26px;line-height:1.5;}
  .field-label{font-size:12px;font-weight:700;color:#655d72;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.03em;}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .emoji-opt{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .emoji-opt.on{border-color:var(--pink);background:#FFF1E6;}
  .color-row{display:flex;flex-wrap:wrap;gap:10px;}
  .color-opt{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
  .color-opt.on{border-color:var(--ink);}
  .theme-grid{display:flex;gap:10px;flex-wrap:wrap;}
  .theme-swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .theme-swatch.on{border-color:var(--ink);}
  .song-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;margin-top:4px;}
  .song-cover{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .onboard-footer{font-size:11px;color:#b3abc0;text-align:center;margin-top:18px;}
  .auth-error{background:#FFE3E3;color:#B3261E;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:12px;margin-top:14px;}
  .auth-note{background:#E3F7EC;color:#1E7A4C;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:12px;margin-top:14px;}
  .link-btn{background:none;border:none;color:var(--pink);font-weight:700;font-size:12.5px;cursor:pointer;padding:10px 0 0;text-align:left;}

  /* ===== CAMERA ===== */
  .cam-view{height:100%;background:#111;position:relative;overflow:hidden;display:flex;flex-direction:column;}
  .cam-live-wrap{position:relative;flex:1;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
  .cam-video{width:100%;height:100%;object-fit:cover;}
  .cam-hint{position:absolute;top:64px;left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.85;z-index:2;padding:0 20px;}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .flash.on{animation:flashpop .35s ease;}
  @keyframes flashpop{0%{opacity:.85;}100%{opacity:0;}}
  .sticker-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;padding-top:70px;}
  .sticker-opt{aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;border:none;cursor:pointer;}
  .filter-strip{display:flex;gap:10px;padding:10px 16px;overflow-x:auto;background:#000;}
  .fchip{flex-shrink:0;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:19px;border:2px solid transparent;cursor:pointer;background:#1c1c1c;}
  .fchip.active{border-color:var(--pink);}
  .cam-controls{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;background:#000;}
  .shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:4px solid #666;cursor:pointer;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;}

function renderCaption(text){
  if(!text) return null;
  const parts = text.split(/(#[a-zA-Z0-9_À-ÿ]+)/g);
  return parts.map(function(part, i){
    if(part.charAt(0) === "#" && part.length > 1){
      return <span key={i} className="hashtag">{part}</span>;
    }
    return part;
  });
}

function formatShortDate(iso){
  const d = new Date(iso);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}
function threadKeyOf(thread){ return (thread.type === "group" || thread.type === "community") ? thread.id : thread._pair; }
function timeAgo(ts){
  if(!ts) return "";
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff/60000);
  if(min < 1) return "à l'instant";
  if(min < 60) return min+"min";
  const h = Math.floor(min/60);
  if(h < 24) return h+"h";
  return Math.floor(h/24)+"j";
}
function clampPct(v){ return Math.max(6, Math.min(94, v)); }

/* ============ AUDIO (sons officiels synthétisés + lecture de sons enregistrés) ============ */

let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function beep(ctx, freq, time, dur){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.16, time+0.02);
  gain.gain.linearRampToValueAtTime(0, time+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(time);
  osc.stop(time+dur+0.03);
}
const soundEngine = (() => {
  let timer = null;
  return {
    play(sound){
      soundEngine.stop();
      const ctx = getCtx();
      if(!ctx) return false;
      if(ctx.state === "suspended") ctx.resume();
      let i = 0;
      const step = () => {
        const t = ctx.currentTime + 0.02;
        beep(ctx, sound.freqs[i % sound.freqs.length], t, (sound.tempo/1000)*0.85);
        i++;
      };
      step();
      timer = setInterval(step, sound.tempo);
      return true;
    },
    stop(){ if(timer){ clearInterval(timer); timer = null; } }
  };
})();

let currentUserAudio = null;
function stopAnyAudio(){
  soundEngine.stop();
  if(currentUserAudio){ try{ currentUserAudio.pause(); }catch(e){} currentUserAudio = null; }
}
function playOfficialSound(s){ stopAnyAudio(); soundEngine.play(s); }
function playUserSound(s){
  stopAnyAudio();
  try{
    const audio = new Audio(s.audio);
    audio.play().catch(()=>{});
    currentUserAudio = audio;
  }catch(e){}
}

function Avatar({person, size, fontSize, onClick, className, online, frame}){
  const sz = size || 46;
  const fs = fontSize || Math.round(sz*0.42);
  const p = person || {};
  const cls = "avatar" + (className ? " "+className : "");
  const face = p.avatarUrl
    ? <div className={cls} style={{width:sz, height:sz, backgroundImage:"url("+p.avatarUrl+")", backgroundSize:"cover", backgroundPosition:"center"}} onClick={frame?undefined:onClick}>{online && <span className="online-dot"></span>}</div>
    : <div className={cls} style={{width:sz, height:sz, fontSize:fs, background:p.color || "#EFE6DA"}} onClick={frame?undefined:onClick}>{p.emoji || "🙂"}{online && <span className="online-dot"></span>}</div>;
  if(!frame) return face;
  const pad = Math.max(3, Math.round(sz*0.09));
  return (
    <div onClick={onClick} style={{width:sz+pad*2, height:sz+pad*2, borderRadius:"50%", background:frame, padding:pad, display:"inline-flex", flexShrink:0, cursor:onClick?"pointer":"default"}}>
      {face}
    </div>
  );
}

/* ============ ONBOARDING ============ */

function AuthScreen({onAuthed, t, lang, setLang}){
  const [showLangPicker, setShowLangPicker] = useState(true);
  const [mode, setMode] = useState("signup");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [emoji, setEmoji] = useState(null);
  const [color, setColor] = useState(PROFILE_COLORS[0]);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [resetMsg, setResetMsg] = useState("");

  const canSignup = /\S+@\S+\.\S+/.test(email) && password.length>=6 && name.trim().length>=2 && emoji && !busy;
  const canLogin = /\S+@\S+\.\S+/.test(email) && password.length>=6 && !busy;

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error("Ça prend trop de temps (>"+Math.round(ms/1000)+"s) — vérifie ta connexion.")); }, ms);
      })
    ]);
  }

  async function doSignup(){
    if(!canSignup) return;
    setBusy(true); setError(""); setResetMsg("");
    try{
      const result = await withTimeout(window.firebaseApp.signUp({email:email.trim(), password, name:name.trim().slice(0,18), emoji, color}), 15000);
      if(result && result.pending){
        setBusy(false);
        setResetMsg("Compte créé ! Va vérifier tes emails, clique le lien de confirmation, puis reviens te connecter ici.");
        setMode("login");
      }else{
        onAuthed(result);
      }
    }catch(e){ setError(e.message || "Erreur d'inscription"); setBusy(false); }
  }
  async function doLogin(){
    if(!canLogin) return;
    setBusy(true); setError("");
    try{
      const profile = await withTimeout(window.firebaseApp.signIn({email:email.trim(), password}), 15000);
      onAuthed(profile);
    }catch(e){ setError(e.message || "Erreur de connexion"); setBusy(false); }
  }
  async function doReset(){
    if(!/\S+@\S+\.\S+/.test(email)){ setError(t("auth_enter_email_first")); return; }
    const res = await window.firebaseApp.resetPassword(email.trim());
    setResetMsg(res.ok ? t("auth_reset_sent") : res.msg);
  }

  if(showLangPicker){
    return (
      <div className="onboard">
        <h1 className="display">🌐 What language do you want?</h1>
        <p className="tag">Quelle langue veux-tu utiliser ? · ¿Qué idioma quieres usar?</p>
        <div style={{display:"flex", flexDirection:"column", gap:10, marginTop:24}}>
          {AVAILABLE_LANGS.map(l => (
            <button
              key={l.id}
              className="primary-btn"
              style={lang===l.id ? {} : {background:"#fff", color:"var(--ink)", border:"2px solid var(--line)"}}
              onClick={()=>{ setLang(l.id); setShowLangPicker(false); }}
            >{l.label}</button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="onboard">
      <h1 className="display">{mode==="signup" ? t("auth_welcome_signup") : t("auth_welcome_login")}</h1>
      <p className="tag">{mode==="signup" ? t("auth_tag_signup") : t("auth_tag_login")}</p>

      <div className="tab-row">
        <button className={"tab-pill"+(mode==="signup"?" on":"")} onClick={()=>{setMode("signup"); setError(""); setResetMsg("");}}>{t("auth_tab_signup")}</button>
        <button className={"tab-pill"+(mode==="login"?" on":"")} onClick={()=>{setMode("login"); setError(""); setResetMsg("");}}>{t("auth_tab_login")}</button>
      </div>

      <div className="field-label">{t("auth_email")}</div>
      <input className="name-input" type="email" placeholder="toi@exemple.com" value={email} onChange={e=>setEmail(e.target.value)} />

      <div className="field-label">{t("auth_password")}</div>
      <input className="name-input" type="password" placeholder={t("auth_password_hint")} value={password} onChange={e=>setPassword(e.target.value)} />

      {mode==="signup" && (
        <React.Fragment>
          <div className="field-label">{t("auth_username")}</div>
          <input className="name-input" placeholder={t("auth_username_hint")} value={name} maxLength={18} onChange={e=>setName(e.target.value)} />

          <div className="field-label">{t("auth_choose_avatar")}</div>
          <div className="emoji-grid">
            {AVATAR_EMOJIS.map(em => (
              <button key={em} className={"emoji-opt"+(emoji===em?" on":"")} onClick={()=>setEmoji(em)}>{em}</button>
            ))}
          </div>

          <div className="field-label">{t("auth_choose_color")}</div>
          <div className="color-row">
            {PROFILE_COLORS.map(c => (
              <button key={c} className={"color-opt"+(color===c?" on":"")} style={{background:c}} onClick={()=>setColor(c)} />
            ))}
          </div>
        </React.Fragment>
      )}

      {mode==="login" && (
        <button className="link-btn" onClick={doReset}>{t("auth_forgot_password")}</button>
      )}
      {resetMsg && <div className="auth-note">{resetMsg}</div>}
      {error && <div className="auth-error">{error}</div>}

      <button className="primary-btn" disabled={mode==="signup" ? !canSignup : !canLogin} onClick={mode==="signup" ? doSignup : doLogin}>
        {busy ? "..." : (mode==="signup" ? t("auth_btn_signup") : t("auth_btn_login"))}
      </button>
      {mode==="signup" && <div className="onboard-footer">{t("auth_footer")}</div>}
    </div>
  );
}

function ChatListView({social, onOpenThread, onNewGroup, onViewProfile, onlineCodes, tagDefs, frameDefs, onRelight, t}){
  const [tab, setTab] = useState("tous");
  const friends = social.friends || [];
  const groups = social.groups || [];
  const unread = social.unread || [];

  const groupItems = groups.map(g => ({...g, tkey:g.id}));
  const friendItems = friends.map(f => ({...f, tkey:f.code}));

  let visibleGroups = groupItems;
  let visibleFriends = tab==="groupes" ? [] : friendItems;
  if(tab === "non-lus"){
    visibleGroups = groupItems.filter(g => unread.includes(g.tkey));
    visibleFriends = friendItems.filter(f => unread.includes(f.tkey));
  }
  const nothingUnread = tab==="non-lus" && visibleGroups.length===0 && visibleFriends.length===0;

  return (
    <div>
      <div className="sect-head">
        <div><h2>{t("chat_title")}</h2><p>{t("chat_subtitle")}</p></div>
        <button className="mini-btn" onClick={onNewGroup}>{t("chat_new_group")}</button>
      </div>

      <div className="tab-row">
        <button className={"tab-pill"+(tab==="tous"?" on":"")} onClick={()=>setTab("tous")}>{t("chat_tab_all")}</button>
        <button className={"tab-pill"+(tab==="non-lus"?" on":"")} onClick={()=>setTab("non-lus")}>{t("chat_tab_unread")}{unread.length>0 ? " · "+unread.length : ""}</button>
        <button className={"tab-pill"+(tab==="groupes"?" on":"")} onClick={()=>setTab("groupes")}>{t("chat_tab_groups")}{groups.length>0 ? " · "+groups.length : ""}</button>
      </div>

      {visibleGroups.length > 0 && <div className="list-label">{t("chat_groups_label")}</div>}
      {visibleGroups.map(g => (
        <div className="friend-row" key={g.id} onClick={()=>onOpenThread({type:"group", id:g.id, name:g.name, emoji:g.emoji})}>
          <div className="avatar" style={{background:"#EFE6DA"}}>{g.emoji}</div>
          <div style={{flex:1, minWidth:0}}>
            <div className="friend-name">{g.name}</div>
            <div className="friend-msg">{t("chat_tap_to_chat")}</div>
          </div>
          {unread.includes(g.tkey) && <span className="unread-dot"></span>}
        </div>
      ))}

      {tab === "tous" && friends.length === 0 && (
        <EmptyState emoji="🙋" text={t("chat_empty_friends")} />
      )}
      {visibleFriends.length > 0 && <div className="list-label">{t("chat_friends_label")}</div>}
      {visibleFriends.map(f => {
        const tag = f.equippedTag ? (tagDefs||[]).find(function(t){ return t.id===f.equippedTag; }) : null;
        const frame = f.equippedFrame ? (frameDefs||[]).find(function(fr){ return fr.id===f.equippedFrame; }) : null;
        return (
          <div className="friend-row" key={f.code} onClick={()=>onOpenThread({type:"dm", code:f.code, name:f.name, emoji:f.emoji, color:f.color, avatarUrl:f.avatarUrl})}>
            <Avatar person={f} onClick={(e)=>{e.stopPropagation(); onViewProfile(f);}} online={onlineCodes && onlineCodes.has(f.code)} frame={frame ? frame.css : null} />
            <div style={{flex:1, minWidth:0}}>
              <div className="friend-name">
                <span style={nameTextStyle(f)}>{f.name}</span>
                {f.streak > 0 && <span className="streak-chip">🔥 {f.streak}</span>}
                {f.deadStreak > 0 && <span className="streak-chip dead" onClick={(e)=>{e.stopPropagation(); onRelight(f);}}>💨 {f.deadStreak} · {t("chat_relight")}</span>}
                {tag && <span style={{marginLeft:6}}><TagBadge tag={tag} /></span>}
              </div>
              <div className="friend-msg">{t("chat_tap_hi")}</div>
            </div>
            {unread.includes(f.tkey) && <span className="unread-dot"></span>}
          </div>
        );
      })}

      {nothingUnread && <EmptyState emoji="📭" text={t("chat_empty_unread")} />}
      {tab === "groupes" && groups.length === 0 && <EmptyState emoji="👥" text={t("chat_empty_groups")} />}
    </div>
  );
}

const CHAT_STICKERS = ["sticker-laugh","heart","sticker-fire","sticker-cry","sticker-thumbsup","sticker-party","sticker-heart-eyes","sticker-skull","sticker-pleading","sticker-eyes","sticker-sparkles","sticker-cool"];

function ChatThreadView({me, thread, onBack, onViewProfile, onOpenGroupInfo, onToast, onlineCodes}){
  const [messages, setMessages] = useState([]);
  const [readBy, setReadBy] = useState({});
  const [members, setMembers] = useState(thread.members || []);
  const [draft, setDraft] = useState("");
  const [sendingImage, setSendingImage] = useState(false);
  const [showAttach, setShowAttach] = useState(false);
  const [showStickers, setShowStickers] = useState(false);
  const [revealed, setRevealed] = useState({});
  const [recordingVoice, setRecordingVoice] = useState(false);
  const [voiceSeconds, setVoiceSeconds] = useState(0);
  const [confirmDeleteMsgId, setConfirmDeleteMsgId] = useState(null);
  const [micIssue, setMicIssue] = useState(null);
  const [wallpaper, setWallpaper] = useState(null);
  const wallpaperInputRef = useRef(null);
  const fileRef = useRef(null);
  const voiceRecorderRef = useRef(null);
  const voiceChunksRef = useRef([]);
  const voiceStreamRef = useRef(null);
  const voiceIntervalRef = useRef(null);
  const voiceStartingRef = useRef(false);
  const voiceWantStopRef = useRef(false);
  const MAX_VOICE_SECONDS = 60;

  useEffect(() => () => {
    if(voiceIntervalRef.current) clearInterval(voiceIntervalRef.current);
    if(voiceStreamRef.current) voiceStreamRef.current.getTracks().forEach(t=>t.stop());
  }, []);

  useEffect(() => {
    const tkey = threadKeyOf(thread);
    window.firebaseApp.loadThreadWallpaper(me.code, tkey).then(setWallpaper);
  }, [thread.id, thread._pair]);

  function handleWallpaperFile(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const url = await window.firebaseApp.uploadWallpaper(me.code, reader.result);
        const tkey = threadKeyOf(thread);
        await window.firebaseApp.setThreadWallpaper(me.code, tkey, url);
        setWallpaper(url);
      }catch(err){ onToast(err.message || "Erreur d'envoi du fond d'écran"); }
    };
    reader.readAsDataURL(file);
  }
  async function resetWallpaper(){
    const tkey = threadKeyOf(thread);
    try{
      await window.firebaseApp.setThreadWallpaper(me.code, tkey, null);
      setWallpaper(null);
    }catch(err){ onToast(err.message || "Erreur"); }
  }

  async function startVoiceRecord(e){
    if(e && e.pointerId!=null && e.target && e.target.setPointerCapture){ try{ e.target.setPointerCapture(e.pointerId); }catch(err){} }
    if(voiceStartingRef.current || recordingVoice) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setMicIssue("Ton navigateur ne permet pas d'enregistrer un vocal ici.");
      return;
    }
    voiceStartingRef.current = true;
    voiceWantStopRef.current = false;
    setMicIssue(null);
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      voiceStreamRef.current = stream;
      const recorder = new MediaRecorder(stream);
      voiceChunksRef.current = [];
      recorder.ondataavailable = ev => { if(ev.data && ev.data.size>0) voiceChunksRef.current.push(ev.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(voiceChunksRef.current, {type: recorder.mimeType || "audio/webm"});
        if(blob.size < 800){ if(onToast) onToast("Vocal trop court"); return; }
        const reader = new FileReader();
        reader.onload = async () => {
          setSendingImage(true);
          try{
            const url = await window.firebaseApp.uploadVoiceMessage(me.code, reader.result);
            const updated = await window.firebaseApp.sendMessage(me, thread, null, {audio:url});
            setMessages(updated.messages||[]);
            setReadBy(updated.readBy||{});
          }catch(err){ if(onToast) onToast(err.message || "Erreur d'envoi du vocal"); }
          setSendingImage(false);
        };
        reader.readAsDataURL(blob);
      };
      voiceRecorderRef.current = recorder;
      voiceStartingRef.current = false;
      if(voiceWantStopRef.current){
        stream.getTracks().forEach(t=>t.stop());
        voiceRecorderRef.current = null;
        return;
      }
      recorder.start();
      setRecordingVoice(true);
      setVoiceSeconds(0);
      voiceIntervalRef.current = setInterval(() => {
        setVoiceSeconds(s => {
          if(s+1 >= MAX_VOICE_SECONDS){ stopVoiceRecord(); return MAX_VOICE_SECONDS; }
          return s+1;
        });
      }, 1000);
    }catch(err){
      voiceStartingRef.current = false;
      if(err && err.name === "NotAllowedError"){
        setMicIssue("Micro bloqué — touche le 🔒 à côté de l'adresse du site, autorise le micro, puis réessaie.");
      }else if(err && err.name === "NotFoundError"){
        setMicIssue("Aucun micro détecté sur cet appareil.");
      }else{
        setMicIssue("Micro indisponible ici. Réessaie dans un instant.");
      }
    }
  }
  function stopVoiceRecord(){
    voiceWantStopRef.current = true;
    if(voiceRecorderRef.current && voiceRecorderRef.current.state !== "inactive") voiceRecorderRef.current.stop();
    if(voiceIntervalRef.current){ clearInterval(voiceIntervalRef.current); voiceIntervalRef.current=null; }
    setRecordingVoice(false);
  }

  useEffect(() => {
    let cancelled = false;
    async function load(){
      const data = await window.firebaseApp.loadThread(me, thread);
      if(!cancelled){
        setMessages(data.messages||[]);
        setReadBy(data.readBy||{});
        if(data.members) setMembers(data.members);
      }
    }
    load();
    const id = setInterval(load, 4000);
    return () => { cancelled = true; clearInterval(id); };
  }, [thread.id, thread.code, thread.type]);

  async function send(){
    const text = draft.trim();
    if(!text) return;
    setDraft("");
    const updated = await window.firebaseApp.sendMessage(me, thread, text, {});
    setMessages(updated.messages||[]);
    setReadBy(updated.readBy||{});
  }

  function pickImage(){
    fileRef.current && fileRef.current.click();
  }
  function handleImageFile(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 480;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        const sx = (img.width-side)/2, sy = (img.height-side)/2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        sendImage(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  async function sendImage(dataUrl){
    setSendingImage(true);
    try{
      const url = await window.firebaseApp.uploadChatImage(me.code, dataUrl);
      const updated = await window.firebaseApp.sendMessage(me, thread, null, {image:url, viewOnce:true});
      setMessages(updated.messages||[]);
      setReadBy(updated.readBy||{});
    }catch(e){}
    setSendingImage(false);
  }
  function sendLocation(){
    if(!navigator.geolocation){ return; }
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const loc = pos.coords.latitude.toFixed(5)+","+pos.coords.longitude.toFixed(5);
      const updated = await window.firebaseApp.sendMessage(me, thread, null, {location:loc});
      setMessages(updated.messages||[]);
      setReadBy(updated.readBy||{});
    }, () => {});
  }
  async function sendSticker(emoji){
    setShowStickers(false);
    const updated = await window.firebaseApp.sendMessage(me, thread, emoji, {isSticker:true});
    setMessages(updated.messages||[]);
    setReadBy(updated.readBy||{});
  }

  async function react(msgId){
    const updated = await window.firebaseApp.toggleReaction(me, thread, msgId);
    setMessages(updated.messages||[]);
  }
  async function revealSnap(msgId){
    setRevealed(prev => ({...prev, [msgId]: true}));
    await window.firebaseApp.openSnap(msgId);
  }
  async function keepThisSnap(msgId){
    await window.firebaseApp.keepSnap(msgId);
    setMessages(prev => prev.map(m => m.id===msgId ? {...m, kept:true} : m));
  }
  async function handleDeleteMessage(msgId){
    if(confirmDeleteMsgId !== msgId){
      setConfirmDeleteMsgId(msgId);
      setTimeout(()=>setConfirmDeleteMsgId(prev => prev===msgId ? null : prev), 3000);
      return;
    }
    setConfirmDeleteMsgId(null);
    try{
      const updated = await window.firebaseApp.deleteMessage(me, thread, msgId);
      setMessages(updated.messages||[]);
      setReadBy(updated.readBy||{});
    }catch(err){ if(onToast) onToast(err.message || "Erreur de suppression"); }
  }

  const lastMineIdx = [...messages].map((m,i)=>({m,i})).reverse().find(x=>x.m.from===me.code);
  const theirTs = thread.type==="dm" ? readBy[thread.code] : null;
  const seen = thread.type==="dm" && lastMineIdx && theirTs && theirTs >= lastMineIdx.m.ts;
  const isThreadOnline = thread.type==="dm" && onlineCodes && onlineCodes.has(thread.code);

  return (
    <div className="chat-view">
      <div className="chat-head">
        <button className="backbtn" onClick={onBack}>←</button>
        <div
          className="avatar"
          style={thread.avatarUrl ? {width:36, height:36, backgroundImage:"url("+thread.avatarUrl+")", backgroundSize:"cover", backgroundPosition:"center", cursor:"pointer"} : {background: thread.color || "#EFE6DA", width:36, height:36, fontSize:15, cursor:"pointer"}}
          onClick={()=>{ if(thread.type==="dm") onViewProfile({code:thread.code, name:thread.name, emoji:thread.emoji, color:thread.color, avatarUrl:thread.avatarUrl}); else if(thread.type==="group") onOpenGroupInfo(thread.id); }}
        >{!thread.avatarUrl && thread.emoji}{isThreadOnline && <span className="online-dot"></span>}</div>
        <div style={{flex:1, minWidth:0}}>
          <div className="friend-name" style={thread.type==="group" ? {cursor:"pointer"} : {}} onClick={()=>{ if(thread.type==="group") onOpenGroupInfo(thread.id); }}>{thread.name}</div>
          {isThreadOnline && <div className="online-label">en ligne</div>}
        </div>
        <button className="icon-btn" title="Fond d'écran" onClick={()=>wallpaperInputRef.current && wallpaperInputRef.current.click()}>🖼️</button>
        {wallpaper && <button className="icon-btn" title="Retirer le fond d'écran" onClick={resetWallpaper}>✕</button>}
        <input ref={wallpaperInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleWallpaperFile} />
      </div>
      <div className="bubble-list" style={wallpaper ? {backgroundImage:"url("+wallpaper+")", backgroundSize:"cover", backgroundPosition:"center"} : {}}>
        {messages.length === 0 && <EmptyState emoji="✨" text="Aucun message pour l'instant. Dis salut !" />}
        {messages.map((m,i) => {
          const mine = m.from === me.code;
          const reactCount = (m.reactions||[]).length;
          const showSender = thread.type==="group" && !mine;
          const senderInfo = showSender ? members.find(mm=>mm.code===m.from) : null;
          const mid = m.id || i;
          const isRevealedNow = !!revealed[mid];

          let bodyEl;
          if(m.location){
            const parts = m.location.split(",");
            const url = "https://www.google.com/maps?q="+parts[0]+","+parts[1];
            bodyEl = <a href={url} target="_blank" rel="noopener noreferrer" className="location-chip" onClick={e=>e.stopPropagation()}>📍 Voir la position</a>;
          }else if(m.isSticker){
            bodyEl = <div className="sticker-msg" onClick={()=>react(mid)}><Icon name={m.text} size={52} /></div>;
          }else if(m.sharedPost){
            const sp = m.sharedPost;
            bodyEl = (
              <div className="shared-post-card" onClick={()=>react(mid)}>
                <div className="shared-post-media" style={sp.img ? {backgroundImage:"url("+sp.img+")"} : sp.type==="clip" ? {background:"#1c1c1c"} : {background:sp.bg||"#EFE6DA"}}>
                  {sp.type==="clip" ? "▶️" : (!sp.img && (sp.emojiBg || ""))}
                </div>
                <div className="shared-post-info">
                  <div className="shared-post-author">{sp.authorEmoji} {sp.authorName}{sp.type==="clip" ? " · clip" : ""}</div>
                  {sp.caption && <div className="shared-post-caption">{sp.caption}</div>}
                </div>
              </div>
            );
          }else if(m.image && m.viewOnce && !mine && !m.kept){
            if(isRevealedNow){
              bodyEl = (
                <div>
                  <img src={m.image} className="chat-snap" />
                  <button className="keep-btn" onClick={()=>keepThisSnap(mid)}>🔒 Garder cette photo</button>
                </div>
              );
            }else if(m.opened){
              bodyEl = <div className="snap-placeholder">👀 Photo vue</div>;
            }else{
              bodyEl = <div className="snap-placeholder" onClick={()=>revealSnap(mid)}>📸 Toque pour voir (une fois)</div>;
            }
          }else if(m.image){
            bodyEl = <img src={m.image} className="chat-snap" onClick={()=>react(mid)} />;
          }else if(m.audio){
            bodyEl = <audio controls src={m.audio} className="voice-msg" />;
          }else{
            bodyEl = <div className={"bubble "+(mine?"me":"them")} onClick={()=>react(mid)}>{m.text}</div>;
          }

          return (
            <div className={"bubble-row "+(mine?"me":"them")} key={mid}>
              {showSender && <div className="grp-sender">{senderInfo ? senderInfo.name : "Ami"}</div>}
              <div className={"bubble-line"+(mine?" mine":"")}>
                {bodyEl}
                {mine && (
                  <button className="msg-delete-btn" onClick={(ev)=>{ev.stopPropagation(); handleDeleteMessage(mid);}}>{confirmDeleteMsgId===mid ? "Confirmer ?" : "🗑️"}</button>
                )}
              </div>
              {reactCount > 0 && !m.isSticker && <div className="reaction-pill">❤️ {reactCount}</div>}
            </div>
          );
        })}
        {sendingImage && <div className="bubble-row me"><div className="bubble me">Envoi de la photo...</div></div>}
        {thread.type==="dm" && lastMineIdx && (
          <div className="read-note" style={{alignSelf:"flex-end"}}>{seen ? "Vu" : "Envoyé"}</div>
        )}
      </div>

      {showStickers && (
        <div className="sticker-picker">
          {CHAT_STICKERS.map(s => (
            <button key={s} className="sticker-pick-btn" onClick={()=>sendSticker(s)}><Icon name={s} size={30} /></button>
          ))}
        </div>
      )}
      {showAttach && (
        <div className="attach-menu">
          <button onClick={()=>{setShowAttach(false); pickImage();}}>📷 Photo</button>
          <button onClick={()=>{setShowAttach(false); sendLocation();}}>📍 Position</button>
          <button onClick={()=>{setShowAttach(false); setShowStickers(!showStickers);}}>😊 Stickers</button>
        </div>
      )}
      {micIssue && (
        <div className="mic-issue-banner">
          <span>🎙️ {micIssue}</span>
          <button onClick={()=>setMicIssue(null)}>✕</button>
        </div>
      )}
      <div className="composer">
        <button className="snap-btn" onClick={()=>setShowAttach(!showAttach)}>➕</button>
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImageFile} />
        <input value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") send();}} placeholder={"Écris à "+thread.name+"..."} />
        {draft.trim() ? (
          <button className="sendbtn" onClick={send}>➤</button>
        ) : (
          <button
            className={"sendbtn"+(recordingVoice?" recording-mic":"")}
            onPointerDown={startVoiceRecord}
            onPointerUp={stopVoiceRecord}
            onPointerLeave={()=>{ if(recordingVoice) stopVoiceRecord(); }}
            onPointerCancel={stopVoiceRecord}
            onContextMenu={(e)=>e.preventDefault()}
          >{recordingVoice ? voiceSeconds+"s" : "🎤"}</button>
        )}
      </div>
    </div>
  );
}

function ClipCard({me, clip, onLike, onDelete, onComment, onShare, tagDefs, t}){
  const videoRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const liked = (clip.likes||[]).includes(me.code);
  const mine = clip.authorCode === me.code;
  const tag = clip.authorTag ? (tagDefs||[]).find(function(tg){ return tg.id===clip.authorTag; }) : null;

  function toggle(){
    const v = videoRef.current;
    if(!v) return;
    if(v.paused){ v.play(); setPlaying(true); } else { v.pause(); setPlaying(false); }
  }

  function handleDelete(e){
    e.stopPropagation();
    if(!confirmDelete){
      setConfirmDelete(true);
      setTimeout(()=>setConfirmDelete(false), 3000);
      return;
    }
    onDelete(clip.id);
  }

  return (
    <div className="clip" onClick={toggle}>
      <video ref={videoRef} src={clip.video} loop playsInline preload="metadata" onEnded={()=>setPlaying(false)} style={{position:"absolute", inset:0, width:"100%", height:"100%", objectFit:"cover", zIndex:0}} />
      {!playing && <div className="clip-play-overlay">▶️</div>}
      <div className="clip-info">
        <div className="who">{clip.authorEmoji} <span style={nameTextStyle({fontFamily:clip.authorFont, nameGradientFrom:clip.authorNameFrom, nameGradientTo:clip.authorNameTo})}>{clip.authorName}</span>{tag && <span style={{marginLeft:6}}><TagBadge tag={tag} /></span>}</div>
        {clip.caption && <div className="cap">{renderCaption(clip.caption)}</div>}
      </div>
      <div className="clip-side">
        <button onClick={(e)=>{e.stopPropagation(); onLike(clip.id);}}>
          <span className="ico"><Icon name={liked ? "heart" : "heart-outline"} size={22} /></span>
          <div className="num">{(clip.likes||[]).length}</div>
        </button>
        <button onClick={(e)=>{e.stopPropagation(); onComment(clip);}}>
          <span className="ico"><Icon name="chat" size={22} /></span>
          <div className="num">{clip.commentCount||0}</div>
        </button>
        <button onClick={(e)=>{e.stopPropagation(); onShare(clip);}}>
          <span className="ico"><Icon name="share" size={22} /></span>
        </button>
        {mine && (
          <button onClick={handleDelete}>
            <span className="ico"><Icon name="trash" size={20} /></span>
            {confirmDelete && <div className="num">OK?</div>}
          </button>
        )}
      </div>
    </div>
  );
}

function SonRecorderModal({onClose, onPublish, onToast}){
  const [state, setState] = useState("idle");
  const [seconds, setSeconds] = useState(0);
  const [title, setTitle] = useState("");
  const [audioData, setAudioData] = useState(null);
  const [busy, setBusy] = useState(false);
  const streamRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const intervalRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => () => {
    if(recorderRef.current && recorderRef.current.state !== "inactive"){ try{ recorderRef.current.stop(); }catch(e){} }
    if(streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    if(intervalRef.current) clearInterval(intervalRef.current);
  }, []);

  async function startRec(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      streamRef.current = stream;
      const recorder = new MediaRecorder(stream);
      chunksRef.current = [];
      recorder.ondataavailable = e => { if(e.data && e.data.size>0) chunksRef.current.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunksRef.current, {type: recorder.mimeType || "audio/webm"});
        const reader = new FileReader();
        reader.onload = () => { setAudioData(reader.result); setState("ready"); };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
      };
      recorderRef.current = recorder;
      recorder.start();
      setState("recording");
      setSeconds(0);
      intervalRef.current = setInterval(() => {
        setSeconds(s => {
          if(s+1 >= MAX_SON_SECONDS){ stopRec(); return MAX_SON_SECONDS; }
          return s+1;
        });
      }, 1000);
    }catch(e){
      setState("denied");
    }
  }
  function stopRec(){
    if(recorderRef.current && recorderRef.current.state !== "inactive") recorderRef.current.stop();
    if(intervalRef.current){ clearInterval(intervalRef.current); intervalRef.current=null; }
  }
  async function publish(){
    if(!title.trim() || !audioData) return;
    setBusy(true);
    try{
      await onPublish({title:title.trim().slice(0,30), audio:audioData});
      setBusy(false);
    }catch(e){
      setBusy(false);
      onToast(e.message || "Erreur de publication, réessaie");
    }
  }
  function handleAudioFile(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!file) return;
    if(file.size > 5*1024*1024){ setState("toolarge"); return; }
    const reader = new FileReader();
    reader.onload = () => { setAudioData(reader.result); setState("ready"); };
    reader.readAsDataURL(file);
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <h3>Créer un son</h3>
        <p className="sub">{MAX_SON_SECONDS}s max — ta voix, un bruit, une mélodie...</p>

        {state==="idle" && (
          <div style={{textAlign:"center", padding:"20px 0"}}>
            <button className="record-btn-big" onClick={startRec}>🎙️</button>
            <p className="sub" style={{marginTop:10}}>Toque pour enregistrer</p>
            <div className="divider"></div>
            <button className="ghost-btn" onClick={()=>fileInputRef.current && fileInputRef.current.click()}>📁 Importer un fichier audio</button>
            <input ref={fileInputRef} type="file" accept="audio/*" style={{display:"none"}} onChange={handleAudioFile} />
          </div>
        )}
        {state==="recording" && (
          <div style={{textAlign:"center", padding:"20px 0"}}>
            <button className="record-btn-big rec-pulse" onClick={stopRec}>⏹️</button>
            <p className="sub" style={{marginTop:10}}>{seconds}s / {MAX_SON_SECONDS}s — toque pour arrêter</p>
          </div>
        )}
        {state==="ready" && (
          <div style={{padding:"10px 0"}}>
            <audio controls src={audioData} style={{width:"100%"}}></audio>
            <input className="name-input" placeholder="Nom du son" value={title} onChange={e=>setTitle(e.target.value)} maxLength={30} style={{marginTop:12}} />
            <button className="primary-btn" disabled={!title.trim() || busy} onClick={publish}>{busy ? "Publication..." : "Publier"}</button>
            <button className="ghost-btn" onClick={()=>{setAudioData(null); setState("idle");}}>Recommencer</button>
          </div>
        )}
        {state==="toolarge" && <EmptyState emoji="📁" text="Fichier trop lourd (5 Mo max). Choisis-en un plus court." />}
        {state==="denied" && <EmptyState emoji="🎙️" text="Micro indisponible ou refusé ici." />}
      </div>
    </div>
  );
}
